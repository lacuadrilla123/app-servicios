<!-- titulo: Contratar con Pago protegido | desc: Elige día, paga con tarjeta, Bizum o tu monedero y el dinero queda retenido hasta que confirmes que el servicio se ha hecho. -->
<style>
.pg-pago{ padding-block:14px 8px }
.pg-pago-cont{ max-width:1100px }
.pg-pago-volver{ display:inline-flex; align-items:center; gap:4px; height:36px; padding:0 12px 0 6px; margin-left:-6px; border-radius:999px;
  font-size:var(--t-sm); font-weight:600; color:var(--tinta-2); transition:background .18s, color .18s, transform .15s var(--ease) }
.pg-pago-volver:hover{ background:var(--sup); color:var(--tinta) }
.pg-pago-volver:active{ transform:scale(.96) }
.pg-pago-cab{ display:flex; flex-direction:column; gap:8px; margin:10px 0 18px }
.pg-pago-sello{ align-self:flex-start; display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 11px 0 9px; border-radius:999px;
  background:var(--marca-sup); color:var(--marca-tinta); font-size:var(--t-xs); font-weight:700; letter-spacing:.01em }
.pg-pago-prueba{ margin-bottom:18px }

/* bloques numerados */
.pg-pago-bloque{ background:var(--fondo); border:1px solid var(--linea); border-radius:var(--r-xl); padding:18px 16px 20px }
@media (min-width:760px){ .pg-pago-bloque{ padding:24px 26px 26px } }
.pg-pago-tit{ display:flex; align-items:center; gap:10px; margin-bottom:16px }
.pg-pago-n{ width:26px; height:26px; flex:0 0 auto; border-radius:50%; display:grid; place-items:center; background:var(--tinta); color:var(--fondo);
  font:700 .8125rem/1 var(--display) }
.pg-pago-sub{ display:flex; flex-direction:column; gap:12px; padding-top:18px; margin-top:18px; border-top:1px solid var(--linea) }
.pg-pago-et{ font-weight:650; font-size:var(--t-base); color:var(--tinta) }
.pg-pago-opc{ font-weight:500; color:var(--tinta-3) }

/* servicio */
.pg-pago-serv{ display:grid; grid-template-columns:84px minmax(0,1fr); gap:14px; align-items:start }
@media (min-width:760px){ .pg-pago-serv{ grid-template-columns:104px minmax(0,1fr) } }
.pg-pago-mini{ position:relative; display:block; aspect-ratio:1; border-radius:var(--r-l); overflow:hidden; background:var(--sup-2); isolation:isolate }
.pg-pago-mini>.portada,.pg-pago-mini>img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:transform .5s var(--ease) }
a.pg-pago-mini:hover>.portada{ transform:scale(1.05) }
.pg-pago-serv-t{ font:650 var(--t-md)/1.3 var(--texto); letter-spacing:-.01em }
.pg-pago-quien{ display:flex; align-items:center; flex-wrap:wrap; gap:6px 8px; font-size:var(--t-sm); color:var(--tinta-2) }
.pg-pago-quien a{ font-weight:650; color:var(--tinta) }
.pg-pago-quien a:hover{ color:var(--marca) }
.pg-pago-precio{ font:700 var(--t-lg)/1.1 var(--display); letter-spacing:-.02em }
.pg-pago-precio small{ font:500 var(--t-xs) var(--texto); color:var(--tinta-3); letter-spacing:0 }

/* cantidad */
.pg-pago-fila{ display:flex; align-items:center; justify-content:space-between; gap:14px }
.pg-pago-cant{ display:inline-flex; align-items:center; gap:2px; padding:4px; border-radius:999px; background:var(--sup); flex:0 0 auto }
.pg-pago-cant button{ width:40px; height:40px; border-radius:50%; border:0; display:grid; place-items:center; background:var(--fondo); color:var(--tinta);
  box-shadow:var(--sombra-1); transition:transform .15s var(--ease), opacity .2s, box-shadow .2s }
.pg-pago-cant button:hover{ box-shadow:var(--sombra-2) }
.pg-pago-cant button:active{ transform:scale(.88) }
.pg-pago-cant button:disabled{ opacity:.35; box-shadow:none; cursor:not-allowed }
.pg-pago-cant output{ min-width:46px; text-align:center; font:700 var(--t-lg)/1 var(--display); font-variant-numeric:tabular-nums }
.pg-pago-cant output.pg-pago-salta{ animation:pg-pago-salta .3s var(--ease) }
@keyframes pg-pago-salta{ 40%{ transform:scale(1.22) } }
.pg-pago-fijo{ display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:var(--r); background:var(--sup); font-size:var(--t-sm); color:var(--tinta-2) }
.pg-pago-fijo svg{ flex:0 0 auto; margin-top:1px; color:var(--marca) }

/* fecha */
.pg-pago-dias{ display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding:3px 3px 4px; margin:-3px -3px 0; scroll-snap-type:x proximity;
  -webkit-mask-image:linear-gradient(90deg,var(--tinta) 88%,transparent); mask-image:linear-gradient(90deg,var(--tinta) 88%,transparent) }
.pg-pago-dias::-webkit-scrollbar{ display:none }
.pg-pago-dia{ flex:0 0 auto; width:60px; padding:9px 0 10px; display:flex; flex-direction:column; align-items:center; gap:1px; border-radius:16px;
  border:1.5px solid var(--linea-2); background:var(--fondo); color:var(--tinta-2); scroll-snap-align:start;
  transition:background .18s, border-color .18s, color .18s, transform .15s var(--ease) }
.pg-pago-dia:hover{ border-color:var(--tinta-3) }
.pg-pago-dia:active{ transform:scale(.94) }
.pg-pago-dia .ds{ font-size:var(--t-xs); font-weight:650 }
.pg-pago-dia .dn{ font:700 1.3rem/1.15 var(--display); color:var(--tinta); letter-spacing:-.02em }
.pg-pago-dia .dm{ font-size:.6875rem; color:var(--tinta-3) }
.pg-pago-dia.finde .ds{ color:var(--marca) }
.pg-pago-dia[aria-pressed="true"]{ background:var(--tinta); border-color:var(--tinta); color:var(--fondo) }
.pg-pago-dia[aria-pressed="true"] .dn,.pg-pago-dia[aria-pressed="true"] .dm,.pg-pago-dia[aria-pressed="true"] .ds{ color:var(--fondo) }
.pg-pago-dias[aria-invalid="true"] .pg-pago-dia{ border-color:var(--mal) }
@media (min-width:700px){
  .pg-pago-dias{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); overflow:visible; -webkit-mask-image:none; mask-image:none; margin:0; padding:0 }
  .pg-pago-dia{ width:auto }
}
.pg-pago-franja{ display:flex; width:100% }
.pg-pago-franja button{ flex:1; height:auto; min-height:48px; padding:6px 10px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0; line-height:1.2 }
.pg-pago-franja button small{ font-size:.6875rem; font-weight:500; color:var(--tinta-3) }
@media (min-width:520px){ .pg-pago-franja{ width:auto; align-self:flex-start } .pg-pago-franja button{ flex:0 0 auto; min-width:150px } }
.pg-pago-nota{ min-height:92px!important }

/* métodos */
.pg-pago-metodos{ display:flex; flex-direction:column; gap:10px }
.pg-pago-op{ align-items:center; padding:13px 14px }
.pg-pago-op input{ margin:0 }
.pg-pago-op-ico{ width:42px; height:42px; flex:0 0 auto; border-radius:13px; display:grid; place-items:center; background:var(--sup); color:var(--tinta);
  transition:background .2s, color .2s, transform .25s var(--ease) }
.opcion:has(input:checked) .pg-pago-op-ico{ background:var(--marca); color:var(--fondo); transform:rotate(-6deg) }
.pg-pago-op-t{ font-weight:650; font-size:var(--t-base); line-height:1.3 }
.pg-pago-op-d{ font-size:var(--t-xs); color:var(--tinta-2); line-height:1.4 }
.pg-pago-op-d b{ color:var(--tinta); font-weight:650 }
.pg-pago-op.pg-pago-no{ cursor:not-allowed; background:var(--sup); border-color:var(--linea) }
.pg-pago-op.pg-pago-no:hover{ border-color:var(--linea) }
.pg-pago-op.pg-pago-no .pg-pago-op-ico,.pg-pago-op.pg-pago-no .pg-pago-op-t{ opacity:.5 }
.pg-pago-panel{ padding:14px; border-radius:var(--r-l); background:var(--sup); display:flex; flex-direction:column; gap:16px;
  container-type:inline-size; animation:sube .32s var(--ease) both }
@media (min-width:760px){ .pg-pago-panel{ padding:20px } }

/* tarjeta dibujada */
.pg-pago-tj{ display:grid; gap:18px }
@container (min-width:540px){ .pg-pago-tj{ grid-template-columns:250px minmax(0,1fr); align-items:start; gap:22px } }
.pg-pago-tarjeta{ --pg-t-txt:var(--fondo);
  --pg-t-0a:var(--tinta); --pg-t-0b:color-mix(in srgb,var(--tinta) 70%,var(--marca));
  --pg-t-va:var(--marca); --pg-t-vb:var(--marca-tinta);
  --pg-t-ma:color-mix(in srgb,var(--mal) 70%,var(--tinta)); --pg-t-mb:color-mix(in srgb,var(--sol) 45%,var(--mal));
  --pg-t-aa:color-mix(in srgb,var(--ok) 60%,var(--tinta)); --pg-t-ab:var(--ok);
  width:100%; max-width:330px; aspect-ratio:1.586; perspective:1100px; margin-inline:auto; container-type:inline-size; user-select:none }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .pg-pago-tarjeta{ --pg-t-txt:var(--tinta);
  --pg-t-0a:var(--sup-3); --pg-t-0b:color-mix(in srgb,var(--marca) 22%,var(--sup-2));
  --pg-t-va:color-mix(in srgb,var(--marca) 62%,var(--fondo)); --pg-t-vb:color-mix(in srgb,var(--marca-borde) 85%,var(--fondo));
  --pg-t-ma:color-mix(in srgb,var(--mal) 48%,var(--fondo)); --pg-t-mb:color-mix(in srgb,var(--sol) 34%,var(--fondo));
  --pg-t-aa:color-mix(in srgb,var(--ok) 42%,var(--fondo)); --pg-t-ab:color-mix(in srgb,var(--ok) 22%,var(--fondo)) } }
:root[data-theme="dark"] .pg-pago-tarjeta{ --pg-t-txt:var(--tinta);
  --pg-t-0a:var(--sup-3); --pg-t-0b:color-mix(in srgb,var(--marca) 22%,var(--sup-2));
  --pg-t-va:color-mix(in srgb,var(--marca) 62%,var(--fondo)); --pg-t-vb:color-mix(in srgb,var(--marca-borde) 85%,var(--fondo));
  --pg-t-ma:color-mix(in srgb,var(--mal) 48%,var(--fondo)); --pg-t-mb:color-mix(in srgb,var(--sol) 34%,var(--fondo));
  --pg-t-aa:color-mix(in srgb,var(--ok) 42%,var(--fondo)); --pg-t-ab:color-mix(in srgb,var(--ok) 22%,var(--fondo)) }
.pg-pago-giro{ position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .7s var(--ease) }
.pg-pago-tarjeta.vuelta .pg-pago-giro{ transform:rotateY(180deg) }
.pg-pago-cara{ position:absolute; inset:0; border-radius:5.4cqw; overflow:hidden; -webkit-backface-visibility:hidden; backface-visibility:hidden;
  color:var(--pg-t-txt); box-shadow:var(--sombra-2); padding:6cqw 6.4cqw 5.6cqw; display:flex; flex-direction:column; justify-content:space-between; isolation:isolate }
.pg-pago-cara::after{ content:""; position:absolute; z-index:-1; width:78%; aspect-ratio:1; right:-26%; top:-46%; border-radius:50%;
  background:color-mix(in srgb,var(--pg-t-txt) 9%,transparent); box-shadow:0 0 0 14cqw color-mix(in srgb,var(--pg-t-txt) 4%,transparent) }
.pg-pago-fondo{ position:absolute; inset:0; z-index:-2; opacity:0; transition:opacity .5s ease }
.pg-pago-fondo.on{ opacity:1 }
.pg-pago-fondo[data-m=""]{ background:linear-gradient(135deg,var(--pg-t-0a) 0%,var(--pg-t-0b) 100%) }
.pg-pago-fondo[data-m="Visa"]{ background:linear-gradient(135deg,var(--pg-t-va) 0%,var(--pg-t-vb) 100%) }
.pg-pago-fondo[data-m="Mastercard"]{ background:linear-gradient(135deg,var(--pg-t-ma) 0%,var(--pg-t-mb) 100%) }
.pg-pago-fondo[data-m="American Express"]{ background:linear-gradient(135deg,var(--pg-t-aa) 0%,var(--pg-t-ab) 100%) }
.pg-pago-cara.detras{ transform:rotateY(180deg); padding:0; justify-content:flex-start; gap:5cqw }
.pg-pago-arriba{ display:flex; align-items:center; justify-content:space-between }
.pg-pago-chip{ width:13cqw; height:10cqw; border-radius:2.2cqw; position:relative; overflow:hidden;
  background:linear-gradient(135deg,var(--sol) 0%,color-mix(in srgb,var(--sol) 55%,var(--avisa)) 100%) }
.pg-pago-chip::before{ content:""; position:absolute; inset:28% 0; border-block:1px solid color-mix(in srgb,var(--sol-tinta) 40%,transparent) }
.pg-pago-chip::after{ content:""; position:absolute; inset:0 34%; border-inline:1px solid color-mix(in srgb,var(--sol-tinta) 40%,transparent) }
.pg-pago-tmarca{ font:800 6cqw/1 var(--display); letter-spacing:-.02em; font-style:italic; min-height:6cqw; transition:opacity .3s, transform .3s var(--ease) }
.pg-pago-tmarca.pg-pago-cambia{ animation:pg-pago-marca .35s var(--ease) }
@keyframes pg-pago-marca{ from{ opacity:0; transform:translateY(6px) } }
.pg-pago-tnum{ display:flex; gap:.55em; font:600 6.3cqw/1 var(--display); letter-spacing:.06em; font-variant-numeric:tabular-nums; white-space:nowrap }
.pg-pago-tpie{ display:flex; align-items:flex-end; justify-content:space-between; gap:4cqw }
.pg-pago-tet{ display:block; font-size:3cqw; font-weight:600; opacity:.7; text-transform:uppercase; letter-spacing:.06em; margin-bottom:1cqw }
.pg-pago-tval{ display:block; font:600 4.4cqw/1.2 var(--texto); letter-spacing:.04em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.pg-pago-banda{ display:block; height:17%; margin-top:9%; background:color-mix(in srgb,var(--tinta) 82%,var(--marca)) }
.pg-pago-firma{ display:flex; align-items:center; justify-content:flex-end; gap:3cqw; margin:0 6.4cqw; height:15cqw; padding:0 4cqw; border-radius:1.6cqw;
  background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--fondo) 92%,var(--sup-3)) 0 4px,color-mix(in srgb,var(--fondo) 80%,var(--sup-3)) 4px 8px); color:var(--tinta) }
.pg-pago-firma b{ font:italic 700 5cqw/1 var(--display); letter-spacing:.1em; background:var(--fondo); padding:1.4cqw 2.4cqw; border-radius:1cqw }
.pg-pago-detras-t{ margin:0 6.4cqw; font-size:3.2cqw; opacity:.75 }

/* campos */
.pg-pago-ent{ position:relative }
.pg-pago-ent .ent{ padding-right:44px }
.pg-pago-vale svg,.pg-pago-ck svg,.pg-pago-hito svg{ stroke-width:3 }
.pg-pago-vale{ position:absolute; right:14px; top:50%; translate:0 -50%; color:var(--ok); display:grid; opacity:0; transform:scale(.4); transition:opacity .2s, transform .3s var(--ease); pointer-events:none }
.pg-pago-ent.vale .pg-pago-vale{ opacity:1; transform:none }
.pg-pago-dos{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px }
.pg-pago-prefijo .ent{ padding-left:58px }
.pg-pago-prefijo>span:first-child{ position:absolute; left:15px; top:50%; translate:0 -50%; font-weight:600; color:var(--tinta-2); padding-right:10px; border-right:1.5px solid var(--linea-2); line-height:1.2 }

/* tarjetas de prueba */
.pg-pago-pruebas{ border-radius:var(--r); background:var(--fondo); border:1px dashed var(--linea-2); padding:12px 12px 4px }
.pg-pago-pruebas ul{ list-style:none; margin:6px 0 0; padding:0 }
.pg-pago-pruebas li{ display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--linea) }
.pg-pago-pruebas li:first-child{ border-top:0 }
.pg-pago-pruebas .num{ font-weight:600; font-size:var(--t-sm); letter-spacing:.02em; white-space:nowrap }
.pg-pago-pruebas .btn{ flex:0 0 auto; margin-left:auto }
@media (max-width:420px){ .pg-pago-pruebas .pg-pago-pr-txt{ flex-direction:column; align-items:flex-start; gap:3px } }

/* monedero */
.pg-pago-cuentas{ display:flex; flex-direction:column; gap:8px; font-size:var(--t-sm) }
.pg-pago-cuentas>div{ display:flex; justify-content:space-between; gap:12px }
.pg-pago-cuentas .pg-pago-quedan{ padding-top:10px; border-top:1px solid var(--linea-2); font-weight:650 }

/* resumen */
.pg-pago-lado{ min-width:0; align-self:stretch }
.pg-pago-resumen{ display:flex; flex-direction:column; gap:14px }
.pg-pago-res-serv{ display:grid; grid-template-columns:52px minmax(0,1fr); gap:12px; align-items:center; padding-bottom:14px; border-bottom:1px solid var(--linea) }
.pg-pago-res-serv .pg-pago-mini{ border-radius:var(--r) }
@media (max-width:960px){ .pg-pago-res-serv{ display:none } }
.pg-pago-cuando{ display:flex; align-items:center; gap:8px; font-size:var(--t-sm); color:var(--tinta-2) }
.pg-pago-cuando svg{ color:var(--tinta-3); flex:0 0 auto }
.pg-pago-cuando.falta{ color:var(--tinta-3) }
.pg-pago-lineas{ margin:0; display:flex; flex-direction:column; gap:10px; font-size:var(--t-sm) }
.pg-pago-lineas>div{ display:flex; justify-content:space-between; align-items:baseline; gap:12px }
.pg-pago-lineas dt{ color:var(--tinta-2); min-width:0 }
.pg-pago-lineas dd{ margin:0; font-variant-numeric:tabular-nums; font-weight:600; white-space:nowrap }
.pg-pago-lineas .pg-pago-total{ padding-top:12px; margin-top:2px; border-top:1px solid var(--linea); align-items:center }
.pg-pago-lineas .pg-pago-total dt{ color:var(--tinta); font-weight:700; font-size:var(--t-md) }
.pg-pago-lineas .pg-pago-total dd{ font:700 var(--t-xl)/1 var(--display); letter-spacing:-.03em }
.pg-pago-quees{ border:0; background:none; padding:0; font-size:var(--t-xs); font-weight:650; color:var(--marca); text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px }
.pg-pago-quees:hover{ color:var(--marca-2) }
.pg-pago-retiene{ display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:var(--r); background:var(--marca-sup); color:var(--marca-tinta); font-size:var(--t-sm); line-height:1.45 }
.pg-pago-retiene svg{ flex:0 0 auto; margin-top:1px }
.pg-pago-retiene b{ color:var(--marca-tinta) }
.pg-pago-casilla a{ color:var(--tinta); font-weight:600; text-decoration:underline; text-underline-offset:2px; text-decoration-color:var(--linea-2) }
.pg-pago-casilla a:hover{ color:var(--marca) }
.pg-pago-casilla[aria-invalid="true"]{ color:var(--mal) }
.pg-pago-pagar .btn{ gap:10px }
.pg-pago-pagar .num{ font-variant-numeric:tabular-nums }
.pg-pago-nota-pie{ display:flex; align-items:center; justify-content:center; gap:6px; font-size:var(--t-xs); color:var(--tinta-3); text-align:center }
@media (max-width:960px){ .pg-pago-lado .pegajoso{ position:static } }
@media (max-width:860px){
  body:has(.pg-pago-pagar){ padding-bottom:calc(var(--barra) + 78px + env(safe-area-inset-bottom,0px)) }
  .pg-pago-pagar{ position:fixed; z-index:65; left:0; right:0; bottom:calc(var(--barra) + env(safe-area-inset-bottom,0px));
    padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
    background:color-mix(in srgb,var(--fondo) 94%,transparent); backdrop-filter:blur(16px) saturate(1.8); border-top:1px solid var(--linea);
    animation:pg-pago-barra .45s var(--ease) both }
  @keyframes pg-pago-barra{ from{ transform:translateY(100%) } }
}

/* hojas: 3-D Secure, Bizum, procesando */
.pg-pago-hoja{ display:flex; flex-direction:column; gap:16px; padding-top:22px }
.pg-pago-hoja.pg-pago-entra>*{ animation:sube .32s var(--ease) both }
.pg-pago-banco{ display:flex; align-items:center; gap:10px; padding-right:40px }
.pg-pago-banco-ico{ width:40px; height:40px; border-radius:12px; display:grid; place-items:center; background:var(--tinta); color:var(--fondo); flex:0 0 auto }
.pg-pago-dl{ margin:0; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1px; border-radius:var(--r); overflow:hidden; background:var(--linea) }
.pg-pago-dl>div{ background:var(--sup); padding:10px 12px; min-width:0 }
.pg-pago-dl dt{ font-size:var(--t-xs); color:var(--tinta-3); font-weight:600 }
.pg-pago-dl dd{ margin:2px 0 0; font-weight:650; font-size:var(--t-sm); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums }
.pg-pago-codigo{ display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:var(--r); background:var(--sol-sup); color:var(--sol-tinta); font-size:var(--t-sm) }
.pg-pago-codigo b{ font:700 var(--t-md)/1 var(--display); letter-spacing:.14em; background:var(--sol); color:var(--sol-tinta); padding:5px 9px; border-radius:8px; font-variant-numeric:tabular-nums }
.pg-pago-modo{ display:inline-flex; align-items:center; height:22px; padding:0 9px; margin-right:4px; border-radius:999px; background:var(--sol); color:var(--sol-tinta); font-size:var(--t-xs); font-weight:700; vertical-align:1px }

<main id="contenido" class="pg-pago"></main>
<script>
A.pagina = function(){
  const $ = A.$, $$ = A.$$;
  const main = $('#contenido');
  const ses = A.sesion();
  const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const r2 = n => Math.round(n * 100) / 100;

  /* iconos propios (trazo, currentColor) */
  const P = {
    izq:'M15 5l-7 7 7 7', tarjeta:'M3 6.5h18v11H3zM3 10.5h18M6.5 14.5h4', movil:'M7.5 2.8h9v18.4h-9zM11 18h2',
    cartera:'M4 7.5h15.5v12H4zM4 7.5l11-3.5v3.5M15.5 13.6h.1', toque:'M8.4 8.6a5 5 0 0 1 0 6.8M11.8 6.2a8.4 8.4 0 0 1 0 11.6M15.2 3.8a11.8 11.8 0 0 1 0 16.4',
    candado:'M6 10.5h12v9.5H6zM8.6 10.5V8a3.4 3.4 0 0 1 6.8 0v2.5', reloj:'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7.5V12l3 2',
    info:'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 11v5.5M12 7.9v.1', cal:'M4 6h16v14H4zM4 10.2h16M8.5 3.5v4M15.5 3.5v4',
    copia:'M9 9h10.5v10.5H9zM15 9V4.5H4.5V15H9', menos:'M5 12h14', mas:'M12 5v14M5 12h14', etiqueta:'M3.5 12.2V4h8.2l8.8 8.8-8.2 8.2zM8 8.4h.1',
    adulto:'M12 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM5.5 20c.6-3.4 3.2-5.5 6.5-5.5s5.9 2.1 6.5 5.5', doc:'M3.5 6h17v12h-17zM7 10.5h4M7 13.5h6M15.5 10a1.5 1.5 0 1 0 0-.1'
  };
  const ic = (n, t, extra) => `<svg width="${t||20}" height="${t||20}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra||''}><path d="${P[n]}"/></svg>`;

  /* ---------- pedido en curso ---------- */
  const qs = new URLSearchParams(location.search);
  let ped = A.pedido.leer();
  const qsS = qs.get('s');
  if(qsS && A.anuncio(qsS) && qsS !== ped.s) ped = {s:qsS, cantidad:1, extra:0, fecha:'', nota:''};
  const a = A.anuncio(ped.s) || A.anuncio('s5');
  const prov = A.usuario(a.u);
  const nom = prov.n.split(' ')[0];
  const cat = A.categoria(a.cat);

  if(!ses || !A.puede('pagar')) return pintaAcceso();
  if(a.u === ses.id) return pintaPropio();

  /* ---------- unidades ---------- */
  const UNI = {
    hora:{u:'hora', v:'horas', q:'¿Cuántas horas?', min:1, max:8},
    paseo:{u:'paseo', v:'paseos', q:'¿Cuántos paseos?', min:1, max:20},
    foto:{u:'foto', v:'fotos', q:'¿Cuántas fotos?', min:10, max:80, nota:'mínimo 10 fotos'},
    clase:{u:'clase', v:'clases', q:'¿Cuántas clases?', min:1, max:10},
    'sesión':{u:'sesión', v:'sesiones', q:'¿Cuántas sesiones?', min:1, max:12},
    'día':{u:'día', v:'días', q:'¿Cuántos días?', min:1, max:30},
    mes:{u:'mes', v:'meses', q:'¿Cuántos meses?', min:1, max:12},
    'm²':{u:'m²', v:'m²', q:'¿Cuántos metros cuadrados?', min:10, max:300, paso:5},
    servicio:{fijo:true, u:'servicio', v:'servicios'},
    desde:{fijo:true, desde:true, u:'servicio', v:'servicios'}
  };
  /* oferta cerrada en el chat: importe fijo = precio + extra */
  const oferta = ped.oferta && +ped.oferta.importe > 0 ? ped.oferta : null;
  const un = oferta ? {fijo:true, oferta:true, u:'servicio', v:'servicios'} : (UNI[a.unidad] || UNI.servicio);
  const paso = un.paso || 1;
  const ajusta = n => { if(un.fijo) return 1; n = Math.round((+n || un.min) / paso) * paso; return Math.min(un.max, Math.max(un.min, n)) };
  const palabra = n => n === 1 ? un.u : un.v;

  /* ---------- próximos 14 días ---------- */
  const DS = ['dom','lun','mar','mié','jue','vie','sáb'];
  const DL = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const MS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const ML = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const [hy, hm, hd] = A.HOY.split('-').map(Number);
  const ini = a.urg ? 0 : 1;
  const dias = [];
  for(let i = ini; i < ini + 14; i++){
    const d = new Date(hy, hm - 1, hd + i);
    const iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    dias.push({iso, ds: i === 0 ? 'hoy' : DS[d.getDay()], dn: d.getDate(), dm: MS[d.getMonth()], finde: d.getDay() === 0 || d.getDay() === 6,
      corto: (i === 0 ? 'hoy' : DS[d.getDay()]) + ' ' + d.getDate() + ' ' + MS[d.getMonth()],
      largo: (i === 0 ? 'hoy, ' : '') + DL[d.getDay()] + ' ' + d.getDate() + ' de ' + ML[d.getMonth()]});
  }
  const FR = {manana:{t:'Mañana', h:'9:00 a 14:00', por:'por la mañana'}, tarde:{t:'Tarde', h:'16:00 a 21:00', por:'por la tarde'}};

  const st = {
    cant: ajusta(ped.cantidad),
    fecha: dias.some(d => d.iso === ped.fecha) ? ped.fecha : '',
    franja: ped.franja === 'tarde' ? 'tarde' : 'manana',
    nota: (oferta && ped.nota === oferta.concepto ? '' : (ped.nota || '')).slice(0, 300),
    metodo: 'tarjeta'
  };
  const extra = +ped.extra || 0;
  const guarda = () => A.pedido.guardar(Object.assign({}, ped, {s:a.id, cantidad:st.cant, extra, fecha:st.fecha, franja:st.franja, nota:st.nota}));
  guarda();
  const calc = () => A.pedido.calcula({s:a.id, cantidad:st.cant, extra});
  const lineaServ = () => oferta ? r2(a.precio * st.cant + extra) : r2(a.precio * st.cant);
  const extraVisible = oferta ? 0 : extra;
  const lineaTxt = () => oferta ? 'Oferta: ' + (oferta.concepto || 'precio acordado') : un.fijo ? (un.desde ? 'Precio de partida' : 'Servicio completo') : `${A.eur(a.precio)} × ${st.cant} ${palabra(st.cant)}`;
  const cuadra = c => {
    const ok = Math.abs(r2(lineaServ() + extraVisible) - c.base) < 0.001 && Math.abs(r2(c.base + c.prot) - c.total) < 0.001;
    if(!ok) A.errores.push('pago: el desglose no cuadra (' + c.base + ' + ' + c.prot + ' ≠ ' + c.total + ')');
    return ok;
  };
  const diaSel = () => dias.find(d => d.iso === st.fecha);
  const saldo = () => A.MONEDERO.saldo;

  const placeholderNota = {
    mascotas:'Ej.: cómo se llama, si tira de la correa, dónde dejas la llave…',
    hogar:'Ej.: qué falla y desde cuándo, dirección y si hay sitio para aparcar…',
    reparaciones:'Ej.: marca y modelo, qué le pasa, dirección…',
    mudanzas:'Ej.: origen y destino, qué piso y si hay ascensor…',
    clases:'Ej.: tu nivel, qué te gustaría aprender, si traes material…',
    cuidados:'Ej.: quién es, qué necesita, horarios de medicación…'
  }[a.cat] || 'Cuéntale lo que necesita saber: dirección, acceso, detalles del trabajo…';

  const c0 = calc();
  const PRUEBAS = [
    {n:'4242424242424242', r:'Aceptada', cl:'ok', d:'el pago saldrá bien'},
    {n:'4000000000000002', r:'Rechazada', cl:'mal', d:'el banco la rechazará'},
    {n:'4000000000009995', r:'Sin fondos', cl:'avisa', d:'dará fondos insuficientes'}
  ];

  /* ---------- pintado del formulario ---------- */
  main.innerHTML = `
  <div class="contenedor pg-pago-cont">
    <a class="pg-pago-volver" href="anuncio.html?id=${a.id}">${ic('izq',18)}Volver al anuncio</a>
    <header class="pg-pago-cab">
      <span class="pg-pago-sello">${A.icono('escudo',14)}Pago protegido</span>
      <h1 class="h1">Contratar y pagar</h1>
      <p class="sec">Tu dinero queda retenido hasta que confirmes que ${esc(nom)} ha hecho el servicio.</p>
    </header>
    <p class="aviso pg-pago-prueba" role="note"><span><span class="pg-pago-modo">Modo prueba</span> No se cobra nada y ningún dato sale de esta página. La tarjeta no se guarda en ningún sitio, tampoco en tu navegador.</span></p>

    <form class="con-lateral" id="pg-pago-form" novalidate>
      <div class="col g16 min0">

        <section class="pg-pago-bloque" aria-labelledby="pg-pago-t1">
          <div class="pg-pago-tit"><span class="pg-pago-n" aria-hidden="true">1</span><h2 class="h3" id="pg-pago-t1">Servicio</h2></div>
          <div class="pg-pago-serv">
            <a class="pg-pago-mini" href="anuncio.html?id=${a.id}" aria-label="Ver el anuncio: ${esc(a.t)}">${A.portada(a)}</a>
            <div class="col g8 min0">
              <span class="etiqueta">${esc(cat.n)} · ${esc(a.sub)}</span>
              <h3 class="pg-pago-serv-t recorte">${esc(a.t)}</h3>
              <div class="pg-pago-quien">${A.avatar(prov,'avatar-p')}<a href="perfil.html?id=${prov.id}">${esc(prov.corto)}</a>
                ${A.verificado(prov) ? `<span class="insignia insignia-ok">${A.icono('check',12)}Identidad verificada</span>` : ''}
                <span class="fila g4">${A.estrellas(prov.val,12)}<span class="num xs sec">${prov.val.toLocaleString('es-ES',{minimumFractionDigits:1})} (${prov.resenas})</span></span>
              </div>
              <div class="pg-pago-precio">${A.precio(a)}</div>
            </div>
          </div>

          <div class="pg-pago-sub">
            ${un.fijo ? `<div class="pg-pago-fijo">${ic('etiqueta',18)}<span>${un.oferta
                ? `<b>Precio acordado en el chat:</b> ${esc(oferta.concepto || a.t)} por ${A.eur(lineaServ())}.${oferta.chat ? ` <a class="enlace" href="chat.html?c=${esc(oferta.chat)}">Ver la conversación</a>` : ''}`
                : un.desde
                ? `<b>Precio de partida.</b> Si el trabajo necesita más, ${esc(nom)} te enviará una oferta por el chat y solo pagarás la diferencia si la aceptas.`

  /* ---------- hojas: 3-D Secure, Bizum, procesando ---------- */
  let hojaCapa = null, ocupado = false, terminado = false, timers = [];

  function hoja3DS(c){
    const d = TP.limpia(el.num.value), m = TP.marca(d);
    const res = d === '4000000000000002' ? 'rechazada' : d === '4000000000009995' ? 'fondos' : 'ok';

    let intentos = 3, seg = 120;
    const cajas = Array.from({length:6}, (x, i) => `<label class="solo-lector" for="pg-otp-${i}">Cifra ${i + 1} de 6</label><input id="pg-otp-${i}" type="text" inputmode="numeric" pattern="[0-9]*" ${i === 0 ? 'autocomplete="one-time-code"' : 'autocomplete="off"'} aria-describedby="pg-pago-otp-err">`).join('');
    abreHoja(`
      <div class="pg-pago-banco"><span class="pg-pago-banco-ico">${ic('candado',20)}</span><div class="col"><strong>Verificación de tu banco</strong><span class="xs ter">Compra segura · 3-D Secure</span></div></div>
      <h2 class="h2">Confirma que eres tú</h2>
      <dl class="pg-pago-dl"><div><dt>Comercio</dt><dd>Apaño</dd></div><div><dt>Importe</dt><dd>${A.eur(c.total)}</dd></div><div><dt>Tarjeta</dt><dd>•••• ${d.slice(-4)}</dd></div></dl>
      <p class="sm sec">Te hemos enviado un código de 6 cifras por SMS al móvil que tienes dado de alta en tu banco.</p>
      <div class="pg-pago-codigo">${ic('info',18)}<span class="crecer">Es una prueba: tu código es</span><b>123456</b></div>
      <form class="col g12" id="pg-pago-otp-f" novalidate>
        <fieldset class="pg-pago-otp" id="pg-pago-otp"><legend class="solo-lector">Código de verificación de 6 cifras</legend>${cajas}</fieldset>
        <p class="error" id="pg-pago-otp-err" role="alert" hidden></p>
        <div class="pg-pago-reloj"><span id="pg-pago-reloj-t">El código caduca en <b id="pg-pago-reloj">2:00</b></span><span id="pg-pago-intentos">3 intentos</span></div>
        <button class="btn btn-g btn-bloque" type="submit" id="pg-pago-otp-ok">Confirmar ${A.eur(c.total)}</button>
      </form>
      <button class="btn btn-sec btn-bloque" type="button" data-cerrar>Cancelar</button>`, cancelado);
    const ins = $$('#pg-pago-otp input');
    const codigo = () => ins.map(x => x.value).join('');
    const marca = () => ins.forEach(x => x.classList.toggle('lleno', !!x.value));
    const reparte = (i, digitos) => {
      digitos.split('').forEach((dg, k) => { if(ins[i + k]) ins[i + k].value = dg });
      const sig = Math.min(i + digitos.length, 5);
      ins[sig].focus(); marca();

    ins.forEach((inp, i) => {
      inp.addEventListener('input', () => {
        const dg = inp.value.replace(/\D/g, '');
        if(!dg){ inp.value = ''; marca(); return }
        if(dg.length >= 6) return reparte(0, dg.slice(0, 6));
        inp.value = '';
        reparte(i, dg.slice(0, 6 - i));
      });
      inp.addEventListener('keydown', e => {
        if(e.key === 'Backspace' && !inp.value && i > 0){ e.preventDefault(); ins[i - 1].value = ''; ins[i - 1].focus(); marca() }
        else if(e.key === 'ArrowLeft' && i > 0){ e.preventDefault(); ins[i - 1].focus() }
        else if(e.key === 'ArrowRight' && i < 5){ e.preventDefault(); ins[i + 1].focus() }
      });
      inp.addEventListener('paste', e => {
        const t = ((e.clipboardData || window.clipboardData).getData('text') || '').replace(/\D/g, '');
        if(!t) return; e.preventDefault();
        if(t.length >= 6) reparte(0, t.slice(0, 6)); else reparte(i, t.slice(0, 6 - i));

    });
    const pintaReloj = () => { const r = $('#pg-pago-reloj'); if(r) r.textContent = Math.floor(seg / 60) + ':' + String(seg % 60).padStart(2, '0') };
    const arranca = () => {
      timers.push(setInterval(() => {
        seg--; pintaReloj();

    function comprueba(){
      if(seg <= 0 || !hojaCapa) return;

      if(v === '123456'){ para(); return procesa(c, res, etq) }

        </ol>
      </section>

      <section class="pg-pago-recibo" aria-labelledby="pg-pago-rec-t">
        <div class="fila entre g8"><h2 class="h3" id="pg-pago-rec-t">Recibo</h2><span class="insignia insignia-marca">${A.icono('escudo',13)}Retenido</span></div>
        <p class="xs ter num" style="margin-top:-10px">${id} · ${A.fecha(A.HOY)}, ${hora}</p>
        <div class="pg-pago-res-serv" style="display:grid">
          <span class="pg-pago-mini">${A.portada(a)}</span>
          <div class="col g2 min0"><span class="sm negrita recorte">${esc(a.t)}</span><span class="xs ter">con ${esc(prov.n)}</span></div>
        </div>
        <dl class="pg-pago-lineas">
          <div><dt>${esc(lineaTxt())}</dt><dd>${A.eur(lineaServ())}</dd></div>
          ${extraVisible ? `<div><dt>Extras acordados</dt><dd>${A.eur(extraVisible)}</dd></div>` : ''}
          <div><dt>Protección Apaño (5 % + 0,99 €)</dt><dd>${A.eur(c.prot)}</dd></div>
          <div class="pg-pago-total"><dt>Total pagado</dt><dd>${A.eur(c.total)}</dd></div>
        </dl>
        <dl class="pg-pago-datos">
          <div><dt>Método</dt><dd>${esc(metodoTxt)}</dd></div>
          <div><dt>Cuándo</dt><dd>${esc(cuando)} (${fr.h})</dd></div>
          <div><dt>Profesional</dt><dd>${esc(prov.n)}</dd></div>
          ${st.nota.trim() ? `<div><dt>Tu nota</dt><dd style="font-weight:500">${esc(st.nota.trim())}</dd></div>` : ''}
        </dl>
        <p class="xs ter">Pago simulado en modo prueba: no se ha cobrado nada.</p>
      </section>
    </div>`;
    scrollTo({top:0, behavior:'auto'});
    const h = $('#pg-pago-ex-t'); if(h) h.focus({preventScroll:true});
  }

  /* ---------- pantallas de acceso ---------- */
  function ibas(){
    return `<aside class="bloque bloque-sup pg-pago-ibas" aria-label="Servicio que ibas a contratar">
      <span class="etiqueta">Ibas a contratar</span>
      <span class="pg-pago-mini">${A.portada(a, {texto:true})}</span>
      <div class="col g4"><strong class="recorte">${esc(a.t)}</strong><span class="fila g6 sm sec">${A.avatar(prov,'avatar-p')}${esc(prov.corto)} · ${A.precioTxt(a)}</span></div>
      <a class="btn btn-sec btn-bloque" href="anuncio.html?id=${a.id}">Volver al anuncio</a>
    </aside>`;
  }
  function pintaAcceso(){
    const revision = ses && !A.verificado(ses);
    main.innerHTML = `<div class="contenedor pg-pago-acceso">
      <div class="col g20">
        ${revision ? `<span class="insignia insignia-avisa" style="align-self:flex-start">Identidad en revisión</span>` : `<span class="puerta-18" aria-hidden="true">18</span>`}
        <h1 class="h1">${revision ? 'Podrás pagar en cuanto verifiquemos tu identidad' : 'Para pagar necesitas una cuenta verificada'}</h1>
        <p class="entradilla">${revision
          ? 'Estamos revisando tu documento. Suele tardar menos de 2 horas y te avisaremos al terminar. Mientras tanto puedes mirar anuncios y guardar favoritos.'
          : 'En Apaño solo pueden contratar y pagar personas mayores de 18 años que han verificado su identidad. Así quien entra en tu casa y quien te paga es quien dice ser.'}</p>
        <ul class="pg-pago-razones">
          <li><span class="pg-pago-op-ico">${ic('adulto',20)}</span><div><strong>Solo mayores de 18</strong><span>Lo comprobamos con tu documento al darte de alta, no con una casilla.</span></div></li>
          <li><span class="pg-pago-op-ico">${ic('doc',20)}</span><div><strong>DNI, NIE o pasaporte y un selfie</strong><span>Nunca publicamos el número de tu documento. Solo lo ve el equipo de verificación.</span></div></li>
          <li><span class="pg-pago-op-ico">${A.icono('escudo',20)}</span><div><strong>Tu dinero protegido</strong><span>El pago queda retenido hasta que confirmas que el servicio se ha hecho.</span></div></li>
        </ul>
        <div class="pg-pago-acc">${revision
          ? `<a class="btn btn-g" href="cuenta.html#verificacion">Ver el estado de mi verificación</a><a class="btn btn-g btn-sec" href="buscar.html">Seguir mirando</a>`
          : `<a class="btn btn-g" href="registro.html">Crear cuenta</a><a class="btn btn-g btn-sec" href="entrar.html">Ya tengo cuenta</a>`}</div>
        <a class="enlace sm" href="como-funciona.html#verificacion">Por qué pedimos el documento</a>
      </div>
      ${ibas()}
    </div>`;
  }
  function pintaPropio(){
    main.innerHTML = `<div class="contenedor pg-pago-acceso">
      <div class="col g16">
        <span class="insignia insignia-marca" style="align-self:flex-start">Tu anuncio</span>
        <h1 class="h1">No puedes contratar tu propio servicio</h1>
        <p class="entradilla">Este anuncio es tuyo. Cuando alguien lo contrate, verás el pedido en Mis servicios y el cobro llegará a tu monedero.</p>
        <div class="pg-pago-acc"><a class="btn btn-g" href="servicios.html">Ir a Mis servicios</a><a class="btn btn-g btn-sec" href="monedero.html">Ver mi monedero</a></div>
      </div>
      ${ibas()}
    </div>`;
  }
};
</script>
