<!-- titulo: Mi cuenta | desc: Tu perfil, la verificación de identidad, la seguridad, los avisos, los pagos y tus datos en Apaño. -->
<style>
/* ===== MI CUENTA (.pg-cta-) ===== */
.pg-cta{ overflow-x:clip; padding-block:14px 8px }
@media (min-width:961px){ .pg-cta{ padding-block:30px 8px } }
.pg-cta-titulo{ margin:4px 2px 14px }
.pg-cta-carga{ padding-top:10px }

/* --- cabecera de la cuenta --- */
.pg-cta-cab{ position:relative; display:flex; flex-direction:column; align-items:center; text-align:center; gap:12px; padding:26px 18px 0;
  border-radius:var(--r-xl); border:1px solid var(--linea); overflow:hidden;
  background:radial-gradient(130% 80% at 50% 0%, var(--marca-sup) 0%, var(--fondo) 72%) }
.pg-cta-cab .avatar-xg{ box-shadow:0 0 0 4px var(--fondo), var(--sombra-2) }
.pg-cta-cab-txt{ display:flex; flex-direction:column; align-items:center; gap:8px; min-width:0 }
.pg-cta-nombre{ font:700 var(--t-xl)/1.1 var(--display); letter-spacing:-.03em; text-wrap:balance }
.pg-cta-meta{ display:flex; flex-direction:column; align-items:center; gap:2px; font-size:var(--t-sm); color:var(--tinta-2) }
.pg-cta-meta > span{ display:inline-flex; align-items:center; gap:5px }
.pg-cta-meta svg{ color:var(--tinta-3) }
.pg-cta-meta .pg-cta-desde{ color:var(--tinta-3); font-size:var(--t-xs) }
.pg-cta-cab .insignia svg{ width:13px; height:13px }
.pg-cta-datos{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); width:calc(100% + 36px); margin-top:6px; border-top:1px solid var(--linea); background:color-mix(in srgb,var(--fondo) 70%,transparent) }
.pg-cta-dato{ display:flex; flex-direction:column; align-items:center; gap:2px; padding:13px 6px 14px }
.pg-cta-dato + .pg-cta-dato{ border-left:1px solid var(--linea) }
.pg-cta-dato b{ display:inline-flex; align-items:center; gap:4px; font:700 var(--t-lg)/1.1 var(--display); letter-spacing:-.02em; font-variant-numeric:tabular-nums }
.pg-cta-dato b svg{ color:var(--sol) }
.pg-cta-dato span{ font-size:var(--t-xs); color:var(--tinta-3) }
.pg-cta-nueva{ width:calc(100% + 36px); margin-top:6px; padding:13px 18px; border-top:1px solid var(--linea); font-size:var(--t-sm); color:var(--tinta-2) }
.pg-cta-publico{ margin-bottom:4px }
.pg-cta-cab > .pg-cta-publico:last-child,.pg-cta-cab > .pg-cta-cab-txt:last-child{ margin-bottom:22px }
@media (min-width:961px){
  .pg-cta-cab{ flex-direction:row; flex-wrap:wrap; text-align:left; align-items:center; gap:22px; padding:26px 28px;
    background:linear-gradient(105deg, var(--marca-sup) 0%, var(--fondo) 58%) }
  .pg-cta-cab-txt{ align-items:flex-start; flex:1 }
  .pg-cta-meta{ flex-direction:row; gap:8px; align-items:center }
  .pg-cta-meta .pg-cta-desde::before{ content:"·"; margin-right:8px; color:var(--tinta-3) }
  .pg-cta-meta .pg-cta-desde{ font-size:inherit }
  .pg-cta-datos{ width:auto; margin:0; border:0; background:none; grid-template-columns:repeat(3,auto) }
  .pg-cta-dato{ padding:2px 22px }
  .pg-cta-nueva{ width:auto; margin:0; border:0; padding:0; max-width:24ch }
  .pg-cta-publico, .pg-cta-cab > .pg-cta-publico:last-child,.pg-cta-cab > .pg-cta-cab-txt:last-child{ margin:0 }
}

/* --- aviso de cuenta interna --- */
.pg-cta-interna{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:14px; padding:16px 18px; border-radius:var(--r-l);
  background:var(--tinta); color:var(--fondo) }
.pg-cta-interna .sm{ opacity:.78 }
.pg-cta-interna-ico{ width:42px; height:42px; border-radius:13px; display:grid; place-items:center; flex:0 0 auto; background:var(--sol); color:var(--sol-tinta) }

/* --- rejilla lista + panel --- */
.pg-cta-rejilla{ margin-top:22px }
@media (min-width:1100px){ .pg-cta-rejilla.con-lateral-izq{ grid-template-columns:300px minmax(0,1fr) } }
@media (min-width:961px){ .pg-cta-rejilla{ margin-top:28px; gap:32px } }

/* --- lista de secciones (estilo ajustes) --- */
.pg-cta-menu{ display:flex; flex-direction:column; gap:22px; min-width:0 }
@media (min-width:961px){ .pg-cta-menu{ position:sticky; top:calc(var(--cab) + env(safe-area-inset-top,0px) + 18px); gap:18px } }
.pg-cta-grupo-t{ padding:0 4px 8px }
.pg-cta-lista{ list-style:none; margin:0; padding:0; background:var(--fondo); border:1px solid var(--linea); border-radius:var(--r-l); overflow:hidden }
.pg-cta-fila{ position:relative; display:flex; align-items:center; gap:13px; min-height:68px; padding:11px 12px 11px 14px; transition:background .16s }
.pg-cta-lista li + li .pg-cta-fila::before{ content:""; position:absolute; top:0; right:0; left:63px; height:1px; background:var(--linea) }
.pg-cta-fila:hover{ background:var(--sup) }
.pg-cta-fila:active{ background:var(--sup-2) }
.pg-cta-ico.cat-ico{ width:36px; height:36px; border-radius:11px; flex:0 0 auto; box-shadow:0 5px 12px -7px var(--c2) }
.pg-cta-fila-t{ font-weight:600; line-height:1.25; color:var(--tinta) }
.pg-cta-fila-s{ font-size:var(--t-xs); line-height:1.4; color:var(--tinta-3); margin-top:2px }
.pg-cta-fila-s.ok{ color:var(--ok) } .pg-cta-fila-s.avisa{ color:var(--avisa) }
.pg-cta-flecha{ display:grid; color:var(--tinta-3); transition:transform .2s var(--ease), color .2s }
.pg-cta-fila:hover .pg-cta-flecha{ transform:translateX(2px) }
@media (min-width:961px){
  .pg-cta-fila{ min-height:60px; padding-block:9px }
  .pg-cta-fila[aria-current="page"]{ background:var(--marca-sup) }
  .pg-cta-fila[aria-current="page"] .pg-cta-fila-t{ color:var(--marca-tinta) }
  .pg-cta-fila[aria-current="page"]::after{ content:""; position:absolute; left:0; top:12px; bottom:12px; width:3px; border-radius:0 3px 3px 0; background:var(--marca) }
  .pg-cta-flecha{ opacity:0 }
  .pg-cta-fila:hover .pg-cta-flecha,.pg-cta-fila[aria-current="page"] .pg-cta-flecha{ opacity:1 }
  .pg-cta-fila[aria-current="page"] .pg-cta-flecha{ color:var(--marca) }
}
.pg-cta-salir{ display:flex; align-items:center; justify-content:center; gap:9px; width:100%; height:54px; border-radius:var(--r-l); border:1px solid var(--linea);
  background:var(--fondo); color:var(--mal); font-weight:650; transition:background .16s, transform .15s var(--ease) }
.pg-cta-salir:hover{ background:var(--mal-sup) }
.pg-cta-salir:active{ transform:scale(.98) }
.pg-cta-version{ text-align:center; margin-top:-8px }

/* --- vistas en móvil: lista o panel --- */
@media (max-width:960px){
  .pg-cta[data-vista="lista"] .pg-cta-paneles{ display:none }
  .pg-cta[data-vista="panel"] .pg-cta-arriba,.pg-cta[data-vista="panel"] .pg-cta-menu{ display:none }
  .pg-cta[data-vista="panel"] .pg-cta-rejilla{ margin-top:0 }
}
.pg-cta-der{ animation:pg-cta-der .42s var(--ease) both }
.pg-cta-izq{ animation:pg-cta-izq .42s var(--ease) both }
.pg-cta-suave{ animation:pg-cta-suave .32s var(--ease) both }
@keyframes pg-cta-der{ from{ transform:translateX(100%) } }
@keyframes pg-cta-izq{ from{ transform:translateX(-22%); opacity:0 } }
@keyframes pg-cta-suave{ from{ opacity:0; transform:translateY(10px) } }

/* --- paneles --- */
.pg-cta-paneles{ min-width:0 }
.pg-cta-panel{ display:flex; flex-direction:column; gap:14px; min-width:0 }
.pg-cta-panel-cab{ display:flex; flex-direction:column; gap:6px; margin-bottom:6px }
.pg-cta-panel-cab .h1{ outline-offset:4px }
.pg-cta-panel-cab .sec{ max-width:62ch }
.pg-cta-atras{ align-self:flex-start; display:inline-flex; align-items:center; gap:2px; height:38px; padding:0 14px 0 6px; margin:0 0 6px -8px;
  border:0; border-radius:999px; background:transparent; color:var(--marca); font-weight:650; transition:background .16s, transform .15s var(--ease) }
.pg-cta-atras:hover{ background:var(--marca-sup) }
.pg-cta-atras:active{ transform:scale(.95) }
@media (min-width:961px){ .pg-cta-atras{ display:none } }
.pg-cta-bcab{ display:flex; flex-direction:column; gap:4px }
.pg-cta-bcab .sm{ max-width:64ch }

/* filas de ajuste con interruptor */
.pg-cta-ajustes{ display:flex; flex-direction:column }
.pg-cta-ajuste{ display:flex; align-items:center; gap:14px; padding:14px 0 }
.pg-cta-ajustes > .pg-cta-ajuste + .pg-cta-ajuste{ border-top:1px solid var(--linea) }
.pg-cta-ajuste.sin{ padding:0 }
.pg-cta-ajuste-ico{ width:40px; height:40px; border-radius:12px; display:grid; place-items:center; flex:0 0 auto; background:var(--sup); color:var(--tinta-2) }
.pg-cta-ajuste-ico.marca{ background:var(--marca-sup); color:var(--marca) }
.pg-cta-ajuste-ico.ok{ background:var(--ok-sup); color:var(--ok) }
.pg-cta-ajuste-t{ font-weight:600; line-height:1.3 }
.pg-cta-ajuste-d{ font-size:var(--t-sm); color:var(--tinta-2); line-height:1.45 }
.pg-cta-siempre{ font-size:var(--t-xs); font-weight:650; color:var(--tinta-3); white-space:nowrap }

/* formularios */
.pg-cta-2col{ display:grid; gap:16px; grid-template-columns:minmax(0,1fr) }
@media (min-width:600px){ .pg-cta-2col{ grid-template-columns:repeat(2,minmax(0,1fr)) } }
.pg-cta-horas{ display:grid; gap:12px; grid-template-columns:repeat(2,minmax(0,1fr)); transition:opacity .2s }
.pg-cta-horas[aria-disabled="true"]{ opacity:.45 }
.pg-cta-fijo{ position:relative }
.pg-cta-fijo .ent{ background:var(--sup); border-color:transparent; padding-right:44px; font-weight:600; color:var(--tinta) }
.pg-cta-fijo svg{ position:absolute; right:15px; top:50%; translate:0 -50%; color:var(--tinta-3) }
.pg-cta-chips{ flex-wrap:wrap; overflow:visible }
.pg-cta-seg{ display:flex; width:100%; max-width:380px }
.pg-cta-seg button{ flex:1 }
.pg-cta-acciones{ display:flex; gap:10px; flex-wrap:wrap }
.pg-cta-acciones > .btn{ flex:1 1 140px }
.pg-cta-fs{ border:0; margin:0; padding:0; min-width:0 }
.pg-cta-fs legend{ padding:0; margin-bottom:10px; font-size:var(--t-sm); font-weight:600 }
.pg-cta-btn-mal{ color:var(--mal) }
.pg-cta-btn-mal:hover{ background:var(--mal-sup); box-shadow:inset 0 0 0 1.5px var(--mal) }

/* foto de perfil */
.pg-cta-foto-zona{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:14px 18px; align-items:center; transition:border-color .2s, background .2s }
.pg-cta-foto-zona.encima{ border-color:var(--marca); background:var(--marca-sup) }
.pg-cta-foto-nota{ grid-column:1/-1; padding-top:12px; border-top:1px solid var(--linea) }
.pg-cta-foto{ position:relative }
.pg-cta-avimg{ position:absolute; inset:0; width:100%; height:100%; border-radius:50%; object-fit:cover }
.pg-cta-foto-ent:focus-visible + label{ outline:2.5px solid var(--marca); outline-offset:2px }
@media (max-width:420px){ .pg-cta-foto-zona .avatar-xg{ width:80px; height:80px; font-size:1.55rem } }
/* recorte */
.pg-cta-recorte{ position:relative; width:min(100%,300px); aspect-ratio:1; margin-inline:auto; border-radius:var(--r-l); overflow:hidden;
  background:var(--sup-2); touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none }
.pg-cta-recorte.arrastra{ cursor:grabbing }
.pg-cta-recorte img{ position:absolute; left:0; top:0; max-width:none; transform-origin:0 0; pointer-events:none }
.pg-cta-recorte::after{ content:""; position:absolute; inset:0; border-radius:50%; pointer-events:none;
  box-shadow:0 0 0 999px var(--velo); outline:2px solid var(--marca) }
.pg-cta-rango{ width:100%; accent-color:var(--marca) }
/* barra de guardar */
.pg-cta-guardar{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:7px 7px 7px 18px; border-radius:999px;
  border:1px solid transparent; transition:box-shadow .25s, background .25s, border-color .25s }
.pg-cta-guardar.sucio{ position:sticky; bottom:16px; z-index:5; border-color:var(--linea); box-shadow:var(--sombra-2);
  background:color-mix(in srgb,var(--fondo) 90%,transparent); backdrop-filter:blur(14px) saturate(1.6); -webkit-backdrop-filter:blur(14px) saturate(1.6);
  animation:sube .32s var(--ease) both }
@media (max-width:860px){ .pg-cta-guardar.sucio{ bottom:calc(var(--barra) + env(safe-area-inset-bottom,0px) + 10px) } }
.pg-cta-guardar > span{ flex-wrap:nowrap }
.pg-cta-led{ width:8px; height:8px; border-radius:50%; background:var(--linea-2); flex:0 0 auto; transition:background .2s, box-shadow .2s }
.pg-cta-guardar.sucio .pg-cta-led{ background:var(--avisa); box-shadow:0 0 0 4px var(--avisa-sup) }

/* verificación: estado grande */
.pg-cta-estado{ display:flex; flex-direction:column; gap:18px; padding:22px 18px; border-radius:var(--r-xl) }
@media (min-width:600px){ .pg-cta-estado{ padding:26px } }
.pg-cta-estado.ok{ background:var(--ok-sup) }
.pg-cta-estado.avisa{ background:var(--avisa-sup) }
.pg-cta-estado-cab{ display:flex; align-items:center; gap:16px }
.pg-cta-estado-ico{ width:62px; height:62px; border-radius:20px; display:grid; place-items:center; flex:0 0 auto; color:var(--fondo) }
.ok > .pg-cta-estado-cab .pg-cta-estado-ico{ background:var(--ok); box-shadow:0 12px 24px -12px var(--ok) }
.avisa > .pg-cta-estado-cab .pg-cta-estado-ico{ background:var(--avisa); box-shadow:0 12px 24px -12px var(--avisa) }
.pg-cta-estado .h2{ font-size:clamp(1.35rem,3vw,1.75rem) }
.pg-cta-doc{ margin:0; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1px; background:var(--linea); border-radius:var(--r-l); overflow:hidden; box-shadow:var(--sombra-1) }
@media (min-width:700px){ .pg-cta-doc{ grid-template-columns:repeat(3,minmax(0,1fr)) } }
.pg-cta-doc > div{ display:flex; flex-direction:column; gap:3px; padding:13px 15px; background:var(--fondo); min-width:0 }
.pg-cta-doc dt{ font-size:var(--t-xs); font-weight:600; color:var(--tinta-3) }
.pg-cta-doc dd{ margin:0; font-weight:650; color:var(--tinta); overflow-wrap:anywhere }
.pg-cta-doc .num{ letter-spacing:.04em }
.pg-cta-si{ display:inline-flex; align-items:center; gap:5px; color:var(--ok)!important }
.pg-cta-vig{ display:flex; flex-direction:column; gap:8px }
.pg-cta-vig-barra{ height:6px; border-radius:99px; background:color-mix(in srgb,var(--ok) 18%,var(--fondo)); overflow:hidden }
.pg-cta-vig-barra span{ display:block; height:100%; border-radius:99px; background:var(--ok); transform-origin:left; animation:pg-cta-llena .9s var(--ease) both }
@keyframes pg-cta-llena{ from{ transform:scaleX(0) } }
.pg-cta-claro{ background:var(--fondo) }
.pg-cta-estimado{ display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:var(--r-l); background:var(--fondo); box-shadow:var(--sombra-1) }
.pg-cta-estimado b{ display:block; font:700 var(--t-lg)/1.15 var(--display); letter-spacing:-.02em }
.pg-cta-estimado > span{ width:40px; height:40px; border-radius:50%; display:grid; place-items:center; flex:0 0 auto; background:var(--avisa-sup); color:var(--avisa) }

/* comprobaciones */
.pg-cta-checks{ list-style:none; margin:0; padding:0; display:grid; gap:10px; grid-template-columns:minmax(0,1fr) }
@media (min-width:700px){ .pg-cta-checks{ grid-template-columns:repeat(2,minmax(0,1fr)) } }
.pg-cta-check{ display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:var(--r); background:var(--sup); min-width:0 }
.pg-cta-check-ico{ width:38px; height:38px; border-radius:50%; display:grid; place-items:center; flex:0 0 auto; background:var(--fondo); color:var(--tinta-2) }
.pg-cta-renueva{ display:grid; grid-template-columns:40px minmax(0,1fr) auto; gap:4px 14px; align-items:center }
@media (max-width:600px){ .pg-cta-renueva{ align-items:start } .pg-cta-renueva > .btn{ grid-column:2; justify-self:start; margin-top:10px } }
.pg-cta-check-ok{ width:26px; height:26px; border-radius:50%; display:grid; place-items:center; flex:0 0 auto; background:var(--ok); color:var(--fondo) }

/* línea de tiempo */
.pg-cta-linea{ list-style:none; margin:4px 0 0; padding:0 }
.pg-cta-paso{ position:relative; display:grid; grid-template-columns:34px minmax(0,1fr); gap:14px; padding-bottom:22px }
.pg-cta-paso:last-child{ padding-bottom:0 }
.pg-cta-paso::before{ content:""; position:absolute; left:16px; top:38px; bottom:4px; width:2px; border-radius:2px; background:var(--linea-2) }
.pg-cta-paso:last-child::before{ display:none }
.pg-cta-paso.hecho::before{ background:var(--ok) }
.pg-cta-punto{ width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:var(--sup-2); color:var(--tinta-3); font:700 var(--t-sm)/1 var(--display) }
.hecho > .pg-cta-punto{ background:var(--ok); color:var(--fondo) }
.actual > .pg-cta-punto{ background:var(--fondo); color:var(--avisa); box-shadow:0 0 0 2px var(--avisa), 0 0 0 7px var(--avisa-sup) }
.pg-cta-paso-t{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-weight:650; line-height:1.3; padding-top:6px }
.pg-cta-paso p{ font-size:var(--t-sm); color:var(--tinta-2); margin-top:3px }
.pendiente .pg-cta-paso-t{ color:var(--tinta-3) }

/* motivos de rechazo */
.pg-cta-motivos{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column }
.pg-cta-motivos li{ display:flex; gap:14px; align-items:flex-start; padding:13px 0 }
.pg-cta-motivos li + li{ border-top:1px solid var(--linea) }
.pg-cta-motivo-ico{ width:38px; height:38px; border-radius:12px; display:grid; place-items:center; flex:0 0 auto; background:var(--sup); color:var(--tinta-2); font:800 var(--t-sm)/1 var(--display) }
.pg-cta-motivos .grave{ margin-top:4px; padding:14px; border:0; border-radius:var(--r); background:var(--mal-sup) }
.pg-cta-motivos .grave .pg-cta-motivo-ico{ background:var(--mal); color:var(--fondo) }
.pg-cta-motivos .grave b{ color:var(--mal) }
.pg-cta-motivos div > span{ display:block; font-size:var(--t-sm); color:var(--tinta-2); margin-top:2px }

/* tres columnas: qué, quién, cuánto */
.pg-cta-tres{ display:grid; gap:18px; grid-template-columns:minmax(0,1fr) }
@media (min-width:760px){ .pg-cta-tres{ grid-template-columns:repeat(3,minmax(0,1fr)); gap:22px } }
.pg-cta-tres > div{ display:flex; flex-direction:column; gap:6px }
.pg-cta-tres h4{ font-size:var(--t-md); margin-top:4px }
.pg-cta-tres p{ font-size:var(--t-sm); color:var(--tinta-2); line-height:1.55 }
.pg-cta-mini-ico{ width:36px; height:36px; border-radius:11px; display:grid; place-items:center; background:var(--marca-sup); color:var(--marca) }

/* seguridad */
.pg-cta-pass-form > .campo,.pg-cta-pass-form > .fila{ max-width:600px }
.pg-cta-pass{ position:relative }
.pg-cta-pass .ent{ padding-right:54px }
.pg-cta-pass .ico-btn{ position:absolute; right:4px; top:4px }
.pg-cta-medidor{ display:flex; gap:5px; margin-top:2px }
.pg-cta-medidor span{ flex:1; height:5px; border-radius:99px; background:var(--sup-3); transition:background .25s }
.pg-cta-medidor[data-nivel="1"] span:nth-child(-n+1){ background:var(--mal) }
.pg-cta-medidor[data-nivel="2"] span:nth-child(-n+2){ background:var(--avisa) }
.pg-cta-medidor[data-nivel="3"] span:nth-child(-n+3){ background:var(--ok) }
.pg-cta-medidor[data-nivel="4"] span{ background:var(--ok) }
.pg-cta-nivel{ font-weight:650 }
.pg-cta-nivel[data-nivel="1"]{ color:var(--mal) } .pg-cta-nivel[data-nivel="2"]{ color:var(--avisa) } .pg-cta-nivel[data-nivel="3"],.pg-cta-nivel[data-nivel="4"]{ color:var(--ok) }

  /* ================= PANEL: SEGURIDAD ================= */

  /* ================= PANEL: PAGOS ================= */

  /* ================= PANEL: PRIVACIDAD ================= */
  const DATOS = [
    {t:'Tu identidad', r:'Para comprobar que eres mayor de edad y quien dices ser', d:'Documento por las dos caras, selfie, nombre completo y fecha de nacimiento. Solo lo ve el equipo de verificación.', p:'Mientras la cuenta esté activa. Después, bloqueado el tiempo que marque la normativa aplicable.'},

    {t:'Mensajes, pedidos y reseñas', r:'Para prestar el servicio y mediar si algo sale mal', d:'Nadie del equipo lee tus mensajes salvo que haya un reporte o una mediación, y entonces solo los de esa conversación.', p:'Mientras la cuenta esté activa. Los pedidos, lo que exija la normativa fiscal.'},

    <div class="bloque pg-cta-peligro col g16">

  /* ================= MONTAJE ================= */

  pintaCab();

  /* ---------- PERFIL: lógica ---------- */
  (() => {
    const f = $('#f-perfil'), bio = $('#p-bio'), cont = $('#p-bio-n');
    let foto = E.foto, tipo = E.tipo, sucio = false;
    const marca = (v) => { sucio = v !== false; $('#p-barra').classList.toggle('sucio', sucio); $('#p-estado').textContent = sucio ? 'Cambios sin guardar' : 'Sin cambios' };
    const cuenta = () => { const n = bio.value.length; cont.textContent = n + '/300'; cont.style.color = n > 270 ? 'var(--avisa)' : '' };
    bio.value = E.bio; cuenta();
    bio.addEventListener('input', cuenta);
    f.addEventListener('input', e => { if(e.target.id !== 'p-foto-ent') marca() });
    f.addEventListener('change', e => { if(e.target.id !== 'p-foto-ent') marca() });
    $('#p-idi').addEventListener('click', e => { const b = e.target.closest('[data-idioma]'); if(!b) return;
      b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'); $('#p-idi-err').hidden = true; marca() });
    const ayudaTipo = () => { const a = $('#p-tipo-ay'); if(a) a.textContent = tipo === 'profesional'
      ? 'Es tu oficio y emites factura. Tu perfil y tus anuncios mostrarán el distintivo Profesional.'
      : 'Ofreces servicios de vez en cuando, sin factura. Puedes pasarte a profesional cuando quieras.' };
    ayudaTipo();
    $$('[data-tipo]', f).forEach(b => b.addEventListener('click', () => {
      tipo = b.dataset.tipo; $$('[data-tipo]', f).forEach(x => x.setAttribute('aria-pressed', x === b));

      }});
    pintaTarj(); pintaIban();
    $('#tarj').addEventListener('click', e => { const b = e.target.closest('[data-quita]'); if(!b) return; const t = E.tarjetas.find(x => x.id === b.dataset.quita);
      confirma({t:'¿Eliminar la ' + esc(t.marca) + ' ···· ' + esc(t.ult) + '?', d:'Ya no podrás pagar con ella sin volver a añadirla. Los pagos que ya están en curso no cambian.', si:'Eliminar tarjeta',
        alSi:() => { E.tarjetas = E.tarjetas.filter(x => x.id !== t.id); guarda(); pintaTarj(); refrescaMenu(); A.avisa('Tarjeta eliminada') }}) });
    $('#tarj-nueva').addEventListener('click', () => A.dialogo(`<div class="dialogo-cuerpo col g16 pg-cta-dlg">
        <div class="col g8"><h2 class="h2">Añadir tarjeta</h2><p class="sm sec">Para pagar servicios con Pago protegido.</p></div>
        <form id="f-tarj" class="col g16" novalidate>
          <div class="campo"><div class="fila entre g8"><label for="tj-num">Número de la tarjeta</label><span class="insignia" id="tj-marca" hidden></span></div><input class="ent num" id="tj-num" inputmode="numeric" autocomplete="cc-number" placeholder="0000 0000 0000 0000" aria-describedby="tj-num-err"><p class="error" id="tj-num-err" hidden></p></div>
          <div class="pg-cta-horas">
            <div class="campo"><label for="tj-cad">Caducidad</label><input class="ent num" id="tj-cad" inputmode="numeric" autocomplete="cc-exp" placeholder="MM/AA" maxlength="5" aria-describedby="tj-cad-err"><p class="error" id="tj-cad-err" hidden></p></div>
            <div class="campo"><label for="tj-cvc">Código de seguridad</label><input class="ent num" id="tj-cvc" inputmode="numeric" autocomplete="cc-csc" placeholder="CVC" maxlength="4" aria-describedby="tj-cvc-err"><p class="error" id="tj-cvc-err" hidden></p></div>
          </div>
          <p class="aviso aviso-marca">${svg(P.candado, 18)}<span><b>Pago simulado.</b> No se guarda el número: en la app real lo custodia la entidad de pago y Apaño solo ve los 4 últimos.</span></p>
          <button class="btn btn-bloque btn-g" type="submit">Guardar tarjeta</button>
        </form></div>`, {ancho:460, alAbrir:(capa, cerrar) => {
        const T = A.tarjetaPago, n = $('#tj-num', capa), c = $('#tj-cad', capa), v = $('#tj-cvc', capa), m = $('#tj-marca', capa);
        n.addEventListener('input', () => { n.value = T.formatea(n.value); const mc = T.marca(n.value); m.hidden = !mc; m.textContent = mc; error('tj-num', '') });
        c.addEventListener('input', () => { let d = c.value.replace(/\D/g, '').slice(0, 4); c.value = d.length > 2 ? d.slice(0, 2) + '/' + d.slice(2) : d; error('tj-cad', '') });
        v.addEventListener('input', () => { v.value = v.value.replace(/\D/g, '').slice(0, 4); error('tj-cvc', '') });
        $('#f-tarj', capa).addEventListener('submit', e => { e.preventDefault();
          const num = T.limpia(n.value), mm = +c.value.slice(0, 2), aa = +c.value.slice(3, 5), hoyA = +A.HOY.slice(2, 4), hoyM = +A.HOY.slice(5, 7);
          const amex = /^3[47]/.test(num);
          let ok = error('tj-num', !num ? 'Escribe el número de la tarjeta.' : !T.luhn(num) ? 'Ese número no es válido: revisa las cifras.' : '');
          ok = error('tj-cad', !/^\d\d\/\d\d$/.test(c.value) || mm < 1 || mm > 12 ? 'Escribe la fecha como MM/AA.' : (aa < hoyA || (aa === hoyA && mm < hoyM)) ? 'Esta tarjeta ya ha caducado.' : '') && ok;
          ok = error('tj-cvc', v.value.length !== (amex ? 4 : 3) ? 'Son las ' + (amex ? 4 : 3) + ' cifras de detrás.' : '') && ok;
          if(!ok){ const f = $('[aria-invalid="true"]', capa); if(f) f.focus(); return }
          E.tarjetas.push({id:'t' + Date.now(), marca:T.marca(num) || 'Tarjeta', ult:num.slice(-4), cad:c.value}); guarda(); cerrar(); pintaTarj(); refrescaMenu(); A.avisa('Tarjeta guardada') });
      }}));
    $('#f-fact').addEventListener('submit', e => { e.preventDefault();
      const nif = $('#fa-nif').value.trim(), cp = $('#fa-cp').value.trim();
      let ok = error('fa-nif', nif && !nifValido(nif) ? 'Ese NIF o CIF no es válido.' : '');
      ok = error('fa-cp', cp && !/^(0[1-9]|[1-4]\d|5[0-2])\d{3}$/.test(cp) ? 'Un código postal tiene 5 cifras, por ejemplo 07001.' : '') && ok;
      if(!ok){ const f = $('#f-fact [aria-invalid="true"]'); if(f) f.focus(); return }
      E.fact = {nombre:$('#fa-nombre').value.trim(), nif:nif.toUpperCase(), dir:$('#fa-dir').value.trim(), cp, ciudad:$('#fa-ciudad').value.trim()}; guarda();
      A.avisa('Datos de facturación guardados') });
  })();

  /* ---------- PRIVACIDAD: copia de datos y baja ---------- */
  const pideCopia = () => { E.copia = A.HOY + 'T' + new Date().toTimeString().slice(0, 5); guarda(); pintaCopia(); refrescaMenu(); A.avisa('Te avisaremos por correo cuando esté lista') };
  const pintaCopia = () => {
    const c = $('#copia');
    c.innerHTML = !E.copia ? `${ajuste({id:'cp', ic:P.bajar, sin:true, t:'Descargar mis datos', d:'Te preparamos un archivo con tu perfil, anuncios, mensajes, pedidos y pagos: en PDF para leerlo y en JSON para llevártelo a otro servicio.', fijo:' '})}
        <div class="fila g10"><button class="btn btn-suave" type="button" id="copia-pide">${svg(P.bajar, 17)}Pedir una copia</button></div>`
      : `${ajuste({id:'cp', ic:P.bajar, tono:'marca', sin:true, t:'Preparando tu copia', d:'Te llegará por correo a ' + correoM + '. Suele tardar unas horas; como máximo, un mes.', fijo:' '})}
        <div class="col g8" role="group" aria-label="Estado de la copia: preparando">
          <div class="progreso"><span class="hecho"></span><span class="activo"></span><span></span></div>
          <div class="pg-cta-etapas"><span class="hecho">Pedida el ${A.fechaCorta(E.copia)}, ${E.copia.slice(11)}</span><span class="activo">Preparando</span><span>Enviada a tu correo</span></div>
        </div>
        <div class="fila g10"><button class="btn btn-sec btn-p" type="button" id="copia-cancela">Cancelar la petición</button></div>`;
    const p = $('#copia-pide'); if(p) p.addEventListener('click', pideCopia);
    const k = $('#copia-cancela'); if(k) k.addEventListener('click', () => { E.copia = ''; guarda(); pintaCopia(); refrescaMenu(); A.avisa('Petición cancelada') });
  };
  pintaCopia();
  const borra = $('#borra-abre');
  if(borra) borra.addEventListener('click', () => {
    const abiertos = (A.PEDIDOS || []).filter(p => (p.cliente === u.id || p.prov === u.id) && p.estado !== 'completado');
    const saldo = verif && A.MONEDERO ? A.MONEDERO.saldo : 0;
    const pendiente = saldo || abiertos.length ? `<p class="aviso aviso-avisa">${svg(P.alerta, 18)}<span>${saldo ? `Tienes <b>${A.eur(saldo)}</b> en el monedero` : ''}${saldo && abiertos.length ? ' y ' : ''}${abiertos.length ? `<b>${abiertos.length} ${abiertos.length === 1 ? 'servicio' : 'servicios'} sin cerrar</b>${abiertos.some(p => p.estado === 'en disputa') ? ', uno en mediación' : ''}` : ''}. ${saldo ? '<a class="enlace" href="monedero.html">Retira el saldo</a> antes de seguir: ' : ''}los servicios en curso y las mediaciones seguirán hasta resolverse.</span></p>` : '';
    A.dialogo(`<div class="dialogo-cuerpo col g16 pg-cta-dlg" id="borra-cuerpo">
        <span class="pg-cta-alerta">${svg(P.alerta, 26)}</span>
        <div class="col g8"><h2 class="h2" id="borra-t" tabindex="-1">Eliminar tu cuenta</h2><p class="sec">Vas a borrar tu cuenta de Apaño. <b>No se puede deshacer</b>: no podrás recuperarla ni volver a ver tus mensajes, y para volver tendrías que darte de alta y verificarte de nuevo.</p></div>
        ${pendiente}
        <div class="pg-cta-borra">
          <div><h3>Qué borramos</h3><ul><li>Tu perfil, tu foto y tu bio</li><li>Tus anuncios y tus favoritos</li><li>Tus mensajes: los demás verán «Usuario eliminado»</li><li>Tu nombre en las reseñas que escribiste, que quedan anónimas</li><li>Tus ajustes y tus sesiones abiertas</li></ul></div>
          <div><h3>Qué conservamos porque la ley lo exige</h3><ul><li>Pagos, cobros y facturas, el tiempo que marca la normativa fiscal y mercantil</li><li>Tu documento de identidad y el selfie, bloqueados el tiempo que marque la ley (por ejemplo, la de prevención del blanqueo de capitales)</li><li>Nadie podrá usarlos salvo para atender a jueces o autoridades. Pasado el plazo, se borran</li></ul></div>
        </div>
        <p class="sm sec">¿Quieres llevarte una copia antes? <button type="button" class="enlace" id="borra-copia" style="border:0;background:none;padding:0;font:inherit;font-weight:600;cursor:pointer">Pide tus datos</button> y espera a recibirla.</p>
        <form id="f-borra" class="col g12" novalidate>
          <div class="campo"><label for="borra-ent">Para confirmar, escribe <b>ELIMINAR</b></label><input class="ent pg-cta-confirma" id="borra-ent" autocomplete="off" spellcheck="false" autocapitalize="characters" aria-describedby="borra-ent-err"><p class="error" id="borra-ent-err" hidden></p></div>
          <button class="btn btn-peligro btn-bloque btn-g" type="submit" id="borra-si" aria-disabled="true">Eliminar mi cuenta para siempre</button>
          <button class="btn btn-sec btn-bloque" type="button" data-cerrar>Cancelar</button>
        </form></div>`, {ancho:620, alAbrir:(capa) => {
      $('#borra-t', capa).focus({preventScroll:true}); $('.dialogo', capa).scrollTop = 0;
      const i = $('#borra-ent', capa), b = $('#borra-si', capa);
      i.addEventListener('input', () => { b.setAttribute('aria-disabled', i.value.trim() !== 'ELIMINAR'); error('borra-ent', '') });
      $('#borra-copia', capa).addEventListener('click', () => { if(!E.copia) pideCopia(); else A.avisa('Ya estamos preparando tu copia') });
      $('#f-borra', capa).addEventListener('submit', e => { e.preventDefault();
        if(!error('borra-ent', i.value.trim() === 'ELIMINAR' ? '' : 'Escribe ELIMINAR, en mayúsculas, para confirmar.')) return i.focus();
        $('#borra-cuerpo', capa).outerHTML = `<div class="dialogo-cuerpo col g16 pg-cta-dlg pg-cta-centro">
          <span class="pg-cta-hecho-ico">${svg(P.check, 30, 'stroke-width="2.6"')}</span>
          <h2 class="h2" tabindex="-1" id="borra-fin">Cuenta eliminada</h2>
          <p class="sec">Es una simulación: en esta demostración no se borra nada. En la app real te mandaríamos la confirmación a ${correoM}.</p>
          <button class="btn btn-bloque btn-g" type="button" id="borra-salir">Salir</button></div>`;
        $('#borra-fin', capa).focus({preventScroll:true});
        $('#borra-salir', capa).addEventListener('click', () => A.cambiaPerfil(''));
      });
    }});
  });

  /* ---------- cerrar sesión ---------- */
  $('#cta-salir').addEventListener('click', () => A.cambiaPerfil(''));

  /* ================= NAVEGACIÓN POR HASH (lista ↔ panel) ================= */
  const mq = matchMedia('(max-width:960px)');
  const porDefecto = verif ? 'perfil' : 'verificacion';
  let vista = '', actual = '', desdeLista = false, scrollLista = 0;
  const anima = (el, cls) => { if(!el || quieto) return; el.classList.remove('pg-cta-der', 'pg-cta-izq', 'pg-cta-suave'); void el.offsetWidth; el.classList.add(cls);
    el.addEventListener('animationend', function f(ev){ if(ev.target === el){ el.classList.remove(cls); el.removeEventListener('animationend', f) } }) };
  const enciende = sec => { $$('.pg-cta-panel', raiz).forEach(p => p.hidden = p.dataset.sec !== sec);
    $$('.pg-cta-fila', raiz).forEach(a => a.dataset.sec === sec ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current')); actual = sec };
  const pinta = (evento) => {
    const h = location.hash.slice(1);
    const vale = /^[a-z0-9-]+$/.test(h) && SECC.includes(h);
    if(h && !vale && evento) return;               /* otras anclas (p. ej. #contenido): no tocar */
    if(h && !vale && S[h]) try{ history.replaceState(null, '', location.pathname + location.search) }catch(err){}  /* sección que este perfil no tiene */
    const sec = vale ? h : '';
    const antes = vista, antesSec = actual;
    if(mq.matches){
      if(sec){
        if(antes === 'lista' && evento){ scrollLista = scrollY; desdeLista = true }
        main.dataset.vista = vista = 'panel'; enciende(sec);
        if(evento && (antes !== 'panel' || antesSec !== sec)){ scrollTo(0, 0); anima($('#cta-' + sec), 'pg-cta-der') }
        if(evento){ const t = $('#cta-t-' + sec); if(t) t.focus({preventScroll:true}) }
      } else {
        main.dataset.vista = vista = 'lista';
        if(antes === 'panel' && evento){ anima($('.pg-cta-arriba', raiz), 'pg-cta-izq'); anima($('.pg-cta-menu', raiz), 'pg-cta-izq'); scrollTo(0, scrollLista);
          const f = $(`.pg-cta-fila[data-sec="${antesSec}"]`, raiz); if(f) f.focus({preventScroll:true}) }
        desdeLista = false;
      }
    } else {
      main.dataset.vista = vista = 'doble';
      const s = sec || actual || porDefecto, cambia = s !== actual;
      enciende(s);
      if(evento && cambia){ anima($('#cta-' + s), 'pg-cta-suave');
        const y = $('.pg-cta-rejilla', raiz).getBoundingClientRect().top + scrollY - 96; if(scrollY > y) scrollTo({top:y, behavior:quieto ? 'auto' : 'smooth'}) }
    }
  };
  raiz.addEventListener('click', e => { if(!e.target.closest('[data-atras]')) return;
    if(desdeLista) history.back(); else { try{ history.replaceState(null, '', location.pathname + location.search) }catch(err){} pinta(true) } });
  addEventListener('hashchange', () => pinta(true));
  if(mq.addEventListener) mq.addEventListener('change', () => pinta(false)); else mq.addListener(() => pinta(false));
  pinta(false);
};
</script>
