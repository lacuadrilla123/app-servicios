<!-- titulo: Moderación | desc: Panel del equipo de Apaño para verificar documentos de identidad, que ningún menor de 18 entre, y moderar usuarios, anuncios y reportes. -->
<style>
.pg-adm{ --pg-adm-cab:var(--cab) }
.pg-adm fieldset,.pg-adm-hoja fieldset{ border:0; margin:0; padding:0; min-width:0 }
.pg-adm-mono{ font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace; font-variant-numeric:tabular-nums; letter-spacing:.04em }

/* ---------- sin acceso ---------- */
.pg-adm-sin{ display:grid; gap:36px; align-items:center; padding-block:36px 12px }
@media (min-width:880px){ .pg-adm-sin{ grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); padding-block:84px 36px } }
.pg-adm-sin .titular{ max-width:14ch }
.pg-adm-sin-acc .btn{ flex:1 1 auto }
@media (min-width:600px){ .pg-adm-sin-acc .btn{ flex:0 0 auto } }
.pg-adm-sin-ilus{ position:relative; width:100%; max-width:420px; aspect-ratio:5/4; margin-inline:auto }
.pg-adm-sin-ilus>.pg-adm-doc{ position:absolute; left:0; top:16%; width:74%; rotate:-7deg; box-shadow:inset 0 0 0 1px var(--linea-2), var(--sombra-3) }
.pg-adm-sin-sel{ position:absolute; right:2%; top:2%; width:40%; aspect-ratio:3/4; rotate:6deg; display:flex; border-radius:12px; box-shadow:var(--sombra-3) }
.pg-adm-sin-sel .pg-adm-doc{ flex:1; aspect-ratio:auto }
.pg-adm-sin-candado{ position:absolute; left:50%; bottom:4%; translate:-50% 0; width:92px; height:92px; border-radius:30px; display:grid; place-items:center;
  background:var(--tinta); color:var(--fondo); box-shadow:var(--sombra-3); border:4px solid var(--fondo) }
.pg-adm-sin-candado::after{ content:"18"; position:absolute; right:-14px; top:-14px; width:38px; height:38px; border-radius:50%; display:grid; place-items:center;
  background:var(--sol); color:var(--sol-tinta); font:800 .9rem/1 var(--display); letter-spacing:-.04em; border:3px solid var(--fondo) }

/* ---------- cabecera del panel ---------- */
.pg-adm-hero{ padding-block:22px 22px; background:radial-gradient(80% 140% at 0% 0%,var(--marca-sup) 0%,transparent 62%) }
.pg-adm-hero-fila{ display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:14px 24px; margin-bottom:20px }
.pg-adm-hero .h1{ font-size:clamp(2rem,4.6vw,2.75rem); letter-spacing:-.035em }
.pg-adm-hero p.sec{ max-width:56ch }
.pg-adm-yo{ display:inline-flex; align-items:center; gap:10px; padding:5px 14px 5px 5px; border-radius:999px; border:1px solid var(--linea); background:var(--fondo);
  box-shadow:var(--sombra-1); text-align:left; color:var(--tinta-2); transition:box-shadow .2s, transform .15s var(--ease) }
.pg-adm-yo:hover{ box-shadow:var(--sombra-2) } .pg-adm-yo:active{ transform:scale(.97) }
.pg-adm-yo .avatar{ width:36px; height:36px }
.pg-adm-yo b{ display:block; font-size:var(--t-sm); line-height:1.2; color:var(--tinta) } .pg-adm-yo small{ display:block; font-size:var(--t-xs); color:var(--tinta-3) }

.pg-adm-cifras{ display:grid; gap:10px; grid-template-columns:repeat(2,minmax(0,1fr)) }
@media (min-width:960px){ .pg-adm-cifras{ grid-template-columns:1.55fr repeat(4,minmax(0,1fr)); gap:12px } }
.pg-adm-cifra{ position:relative; display:flex; flex-direction:column; align-items:flex-start; justify-content:flex-end; gap:2px; min-width:0; min-height:122px; padding:14px;
  border-radius:var(--r-l); border:1px solid var(--linea); background:var(--fondo); color:var(--tinta); text-align:left;
  transition:transform .2s var(--ease), box-shadow .2s, border-color .2s }
.pg-adm-cifra:hover{ transform:translateY(-2px); box-shadow:var(--sombra-2); border-color:transparent }
.pg-adm-cifra:active{ transform:scale(.98) }
.pg-adm-cifra-ico{ position:absolute; top:12px; right:12px; width:34px; height:34px; border-radius:11px; display:grid; place-items:center; background:var(--sup); color:var(--tinta-2) }
.pg-adm-cifra-n{ display:inline-block; font-size:2.1rem; line-height:1; margin-bottom:5px; transform-origin:left bottom }
.pg-adm-cifra-et{ font-size:var(--t-sm); font-weight:650; line-height:1.25 }
.pg-adm-cifra-sub{ font-size:var(--t-xs); color:var(--tinta-3); line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }
.pg-adm-cifra-prin{ grid-column:1/-1; min-height:156px; padding:18px; background:var(--marca); border-color:transparent; color:var(--fondo); box-shadow:0 16px 34px -20px var(--marca) }
.pg-adm-cifra-prin:hover{ box-shadow:0 22px 40px -20px var(--marca) }
.pg-adm-cifra-prin .pg-adm-cifra-n{ font-size:3.5rem }
.pg-adm-cifra-prin .pg-adm-cifra-sub{ color:inherit; opacity:.8 }
.pg-adm-cifra-prin .pg-adm-cifra-ico{ width:42px; height:42px; border-radius:13px; background:color-mix(in srgb,var(--fondo) 16%,transparent); color:inherit }
.pg-adm-cifra-ir{ position:absolute; right:16px; bottom:16px; display:inline-flex; align-items:center; gap:6px; height:36px; padding:0 15px; border-radius:99px;
  background:var(--fondo); color:var(--marca-tinta); font-size:var(--t-sm); font-weight:700; transition:gap .2s var(--ease) }
.pg-adm-cifra-prin:hover .pg-adm-cifra-ir{ gap:10px }
.pg-adm-cifra-menor{ background:var(--tinta); color:var(--fondo); border-color:transparent }
.pg-adm-cifra-menor .pg-adm-cifra-sub{ color:inherit; opacity:.7 }
.pg-adm-cifra-menor .pg-adm-cifra-ico{ background:var(--sol); color:var(--sol-tinta); font:800 .95rem/1 var(--display); letter-spacing:-.04em }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .pg-adm-cifra-menor .pg-adm-cifra-ico,:root:not([data-theme="light"]) .pg-adm-sin-candado::after{ color:var(--fondo) } }
:root[data-theme="dark"] .pg-adm-cifra-menor .pg-adm-cifra-ico,:root[data-theme="dark"] .pg-adm-sin-candado::after{ color:var(--fondo) }
@media (min-width:960px){ .pg-adm-cifra-prin{ grid-column:auto } .pg-adm-cifra{ min-height:156px; padding:18px } .pg-adm-cifra-ir{ position:static; margin-top:10px } }
@keyframes pg-adm-bote{ 40%{ transform:scale(1.22) } }
.pg-adm-cifra-n.bote{ animation:pg-adm-bote .5s var(--ease) }

/* ---------- pestañas fijas ---------- */
.pg-adm-pest{ position:sticky; top:calc(var(--pg-adm-cab) + env(safe-area-inset-top,0px)); z-index:50; border-bottom:1px solid var(--linea);
  background:color-mix(in srgb,var(--fondo) 94%,transparent); backdrop-filter:saturate(1.6) blur(14px) }
.pg-adm-pest .pestanas{ border-bottom:0; margin-bottom:-1px }
.pg-adm-pest .pestana{ display:inline-flex; align-items:center; gap:7px; padding:15px 12px }
.pg-adm-n{ display:inline-grid; place-items:center; min-width:20px; height:20px; padding:0 6px; border-radius:99px; background:var(--sup-2); color:var(--tinta-2);
  font-size:.6875rem; font-weight:700; font-variant-numeric:tabular-nums; transition:background .2s, color .2s }
.pestana[aria-selected="true"] .pg-adm-n{ background:var(--marca); color:var(--fondo) }
.pg-adm-n.mal,.pestana[aria-selected="true"] .pg-adm-n.mal{ background:var(--mal); color:var(--fondo) }

.pg-adm-panel{ padding-top:26px }
.pg-adm-pcab{ display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:12px 20px; margin-bottom:18px }
.pg-adm-pcab p{ max-width:64ch }
.pg-adm-lat{ min-width:0 }
.pg-adm-lat-b{ display:flex; flex-direction:column; gap:12px; padding:18px; border:1px solid var(--linea); border-radius:var(--r-l); background:var(--fondo) }
.pg-adm-lat-b.sup{ background:var(--sup); border-color:transparent }
.pg-adm-lat-b.bloque-marca{ background:var(--marca-sup); border-color:var(--marca-borde) }
.pg-adm-lat-t{ font:650 var(--t-md)/1.2 var(--display); letter-spacing:-.02em }
.pg-adm-salto{ display:none; align-items:center; gap:6px; height:34px; padding:0 13px; border-radius:99px; background:var(--mal-sup); color:var(--mal); font-size:var(--t-sm); font-weight:650 }
@media (max-width:960px){ .pg-adm-salto{ display:inline-flex } }
.pg-adm-vacio{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px; padding:40px 20px; border:1.5px dashed var(--linea-2); border-radius:var(--r-xl); color:var(--tinta-2) }
.pg-adm-vacio-ico{ width:56px; height:56px; border-radius:18px; display:grid; place-items:center; background:var(--ok-sup); color:var(--ok); margin-bottom:6px }

/* ---------- ficha de identidad ---------- */
.pg-adm-cola{ display:flex; flex-direction:column }
.pg-adm-ficha{ position:relative; container-type:inline-size; margin-bottom:18px; border:1px solid var(--linea); border-radius:var(--r-xl); background:var(--fondo);
  box-shadow:var(--sombra-1); overflow:hidden; animation:sube .35s var(--ease) both;
  transition:opacity .3s var(--ease), transform .4s var(--ease), height .4s var(--ease), margin .4s var(--ease), border-width .4s }
.pg-adm-ficha.menor{ border:2px solid var(--mal); box-shadow:0 0 0 4px var(--mal-sup) }
.pg-adm-ficha.sale{ opacity:0; transform:translateX(28px) scale(.98); margin-bottom:0; border-width:0 }
.pg-adm-banda{ display:flex; align-items:center; gap:9px; padding:10px 18px; background:var(--mal); color:var(--fondo); font-size:var(--t-sm); font-weight:700 }
.pg-adm-ficha-cab{ display:flex; align-items:center; flex-wrap:wrap; gap:10px 12px; padding:16px 18px; border-bottom:1px solid var(--linea) }
.pg-adm-ficha.menor .pg-adm-ficha-cab{ background:var(--mal-sup) }
.pg-adm-ficha-cab .avatar{ width:46px; height:46px; font-size:1rem }
.pg-adm-ficha-n{ font-size:var(--t-lg); line-height:1.15 }
.pg-adm-meta{ font-size:var(--t-sm); color:var(--tinta-2); margin-top:3px }
.pg-adm-ins{ display:flex; flex-wrap:wrap; gap:6px }
@container (max-width:520px){ .pg-adm-ins{ width:100% } }
.pg-adm-ficha-cuerpo{ display:grid; gap:18px; padding:18px }
@container (min-width:640px){ .pg-adm-ficha-cuerpo{ grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:26px; padding:20px 22px } }
.pg-adm-ficha-acc{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; padding:14px 18px 18px; border-top:1px solid var(--linea); background:var(--sup) }
.pg-adm-ficha-acc .btn{ min-width:0; padding:0 14px }
.pg-adm-ficha-acc .pg-adm-aprobar,.pg-adm-ficha-acc .pg-adm-exp{ grid-column:1/-1 }
.pg-adm-ficha.menor .pg-adm-ficha-acc .btn-peligro{ grid-column:1/-1; order:-2 }
.pg-adm-ficha.menor .pg-adm-exp{ order:-1 }
.pg-adm-ficha.menor .pg-adm-aprobar{ grid-column:auto }
@container (min-width:640px){
  .pg-adm-ficha-acc{ display:flex; flex-wrap:wrap; align-items:center; padding:14px 22px }
  .pg-adm-ficha.menor .pg-adm-exp{ order:0 }
}
.pg-adm-btn-mal{ color:var(--mal) } .pg-adm-btn-mal:hover{ color:var(--mal); box-shadow:inset 0 0 0 1.5px var(--mal) }
.pg-adm-exp{ display:flex; align-items:center; gap:7px; font-size:var(--t-sm); font-weight:650; color:var(--mal) }
.pg-adm-sello{ position:absolute; inset:0; z-index:3; display:grid; place-items:center; background:color-mix(in srgb,var(--fondo) 72%,transparent);
  backdrop-filter:blur(3px); opacity:0; transition:opacity .22s ease }
.pg-adm-ficha.resuelta .pg-adm-sello,.pg-adm-auto.resuelta .pg-adm-sello{ opacity:1 }
.pg-adm-sello>span{ display:inline-flex; align-items:center; gap:10px; height:56px; padding:0 24px; border-radius:99px; font:700 var(--t-lg)/1 var(--display);
  background:var(--ok); color:var(--fondo); box-shadow:var(--sombra-3); transform:scale(.6) rotate(-6deg); transition:transform .45s var(--ease) }
.resuelta .pg-adm-sello>span{ transform:none }
.pg-adm-sello.mal>span{ background:var(--mal) } .pg-adm-sello.marca>span{ background:var(--marca) }

/* imágenes de muestra dibujadas con CSS */
.pg-adm-docs{ display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:10px 12px; align-content:start }
.pg-adm-docs-g{ gap:14px 18px }
.pg-adm-img{ display:flex; flex-direction:column; gap:6px; min-width:0; padding:0; border:0; background:none; color:inherit; text-align:left; border-radius:12px }
button.pg-adm-img{ cursor:zoom-in }
button.pg-adm-img:hover .pg-adm-doc{ box-shadow:inset 0 0 0 1px var(--linea-2), var(--sombra-2); transform:translateY(-2px) }
button.pg-adm-img:active .pg-adm-doc{ transform:scale(.98) }
.pg-adm-img-sel{ grid-column:2; grid-row:1 / span 2 }
.pg-adm-img-et{ display:flex; align-items:center; justify-content:space-between; gap:6px; font-size:var(--t-xs); font-weight:650; color:var(--tinta-3) }
.pg-adm-et-mal{ color:var(--mal) }
.pg-adm-pc{ font-variant-numeric:tabular-nums; color:var(--ok) } .pg-adm-pc.avisa{ color:var(--avisa) } .pg-adm-pc.mal{ color:var(--mal) }
.pg-adm-doc{ position:relative; display:block; container-type:inline-size; aspect-ratio:1.586; border-radius:10px; overflow:hidden;
  background:linear-gradient(140deg,var(--sup) 0%,var(--sup-2) 100%); box-shadow:inset 0 0 0 1px var(--linea-2);
  transition:transform .22s var(--ease), box-shadow .22s }
.pg-adm-img-sel .pg-adm-doc{ aspect-ratio:auto; flex:1; min-height:110px }
.pg-adm-doc>i{ position:absolute; display:block; height:5%; border-radius:99px; background:var(--linea-2) }
.pg-adm-doc>i.f{ height:7%; background:var(--tinta-3); opacity:.7 }
.pg-adm-doc>i.b{ background:color-mix(in srgb,var(--tinta-3) 35%,transparent) }
.pg-adm-doc>i.r{ left:6%; width:88%; height:7%; border-radius:2px; background:var(--sup-3) }
.pg-adm-d-banda{ position:absolute; left:0; right:0; top:0; height:20%; background:var(--tono,var(--marca-sup)) }
.pg-adm-d-foto{ position:absolute; left:6%; top:27%; width:27%; height:63%; border-radius:7%; overflow:hidden; background:var(--sup-3); color:var(--tinta-3);
  display:flex; align-items:flex-end; justify-content:center }
.pg-adm-d-foto svg{ width:100%; height:92% }
.pg-adm-doc-sel{ background:radial-gradient(120% 80% at 50% 18%,var(--marca-sup) 0%,var(--sup-2) 72%) }
.pg-adm-doc-sel.oscura{ filter:brightness(.55) saturate(.6) }
.pg-adm-d-sil{ position:absolute; left:6%; right:6%; bottom:0; height:84%; color:var(--tinta-3); display:flex; align-items:flex-end; justify-content:center }
.pg-adm-d-sil svg{ width:100%; height:100% }
.pg-adm-muestra{ position:absolute; left:50%; top:50%; translate:-50% -50%; rotate:-14deg; padding:.28em .55em .22em; border:2px solid currentColor; border-radius:.3em;
  color:var(--mal); opacity:.6; font:800 clamp(9px,9.5cqw,30px)/1 var(--display); letter-spacing:.14em; white-space:nowrap; pointer-events:none }
.pg-adm-medidor{ position:relative; display:block; height:5px; border-radius:9px; background:var(--sup-3) }
.pg-adm-medidor::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:var(--p); border-radius:9px; background:var(--ok) }
.pg-adm-medidor.avisa::before{ background:var(--avisa) } .pg-adm-medidor.mal::before{ background:var(--mal) }
.pg-adm-medidor i{ position:absolute; top:-3px; bottom:-3px; left:var(--u); width:2px; border-radius:2px; background:var(--tinta) }

/* datos */
.pg-adm-edad{ display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:4px 14px; padding:12px 16px 12px 18px; border-radius:var(--r-l);
  background:var(--ok-sup); color:var(--ok) }
.pg-adm-edad.mal{ background:var(--mal-sup); color:var(--mal) }
.pg-adm-edad-n{ font-size:3.6rem; line-height:.95 }
.pg-adm-edad-u{ font-weight:700; font-size:var(--t-md); line-height:1.2 }
.pg-adm-edad-s{ font-size:var(--t-xs); color:var(--tinta-2); margin-top:2px }
.pg-adm-edad-ico{ width:40px; height:40px; border-radius:50%; display:grid; place-items:center; background:var(--fondo) }
.pg-adm-dl{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px 16px; margin:0 }
.pg-adm-dl>div{ min-width:0 } .pg-adm-dl .ancho{ grid-column:1/-1 }
.pg-adm-dl dt{ font-size:var(--t-xs); font-weight:600; color:var(--tinta-3); margin-bottom:3px }
.pg-adm-dl dd{ margin:0; font-weight:600; font-size:var(--t-sm) }
.pg-adm-dl dd.pg-adm-mal{ color:var(--mal) }
.pg-adm-docw{ display:inline-flex; align-items:center; flex-wrap:wrap; gap:8px }
.pg-adm-docnum{ position:relative; display:inline-block; padding:4px 10px; border-radius:8px; background:var(--sup); font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  font-size:var(--t-base); font-weight:600; letter-spacing:.08em; font-variant-numeric:tabular-nums; transition:background .2s, color .2s }
.pg-adm-docw.abierta .pg-adm-docnum{ background:var(--marca-sup); color:var(--marca-tinta) }
.pg-adm-docw.abierta .pg-adm-docnum::after{ content:""; position:absolute; left:8px; right:8px; bottom:2px; height:2px; border-radius:2px; background:var(--marca);
  transform-origin:left; animation:pg-adm-encoge 30s linear forwards }
@keyframes pg-adm-encoge{ to{ transform:scaleX(0) } }
.pg-adm-mostrar{ display:inline-flex; align-items:center; gap:5px; height:30px; padding:0 11px; border:0; border-radius:99px; background:var(--marca-sup); color:var(--marca-tinta);
  font-size:var(--t-xs); font-weight:700; transition:background .18s, transform .15s var(--ease) }
.pg-adm-mostrar:hover{ background:var(--marca-borde) } .pg-adm-mostrar:active{ transform:scale(.94) }
.pg-adm-senales{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px }
.pg-adm-senales li{ display:flex; align-items:flex-start; gap:10px; font-size:var(--t-sm); line-height:1.4; color:var(--tinta-2) }
.pg-adm-senales li.mal{ color:var(--tinta); font-weight:600 }
.pg-adm-sen-ico{ flex:0 0 auto; width:22px; height:22px; margin-top:-1px; border-radius:50%; display:grid; place-items:center; background:var(--ok-sup); color:var(--ok) }
.avisa>.pg-adm-sen-ico{ background:var(--avisa-sup); color:var(--avisa) } .mal>.pg-adm-sen-ico{ background:var(--mal-sup); color:var(--mal) }

/* lateral de identidades */
.pg-adm-autos,.pg-adm-resl,.pg-adm-guia{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px }
.pg-adm-auto{ position:relative; display:flex; flex-direction:column; gap:10px; padding:14px; border-radius:var(--r); background:var(--fondo); border:1px solid var(--linea); overflow:hidden;
  transition:opacity .3s, transform .4s var(--ease), height .4s var(--ease), margin .4s, padding .4s }
.pg-adm-auto.menor{ border:1.5px solid var(--mal); background:linear-gradient(var(--mal-sup),var(--mal-sup)) }
.pg-adm-auto.sale{ opacity:0; transform:translateX(24px); padding-block:0 }
.pg-adm-auto-edad{ display:flex; flex-direction:column; align-items:center; line-height:1; font-size:var(--t-xs); color:var(--mal); font-weight:600 }
.pg-adm-auto-edad b{ font-size:1.6rem }
.pg-adm-auto-mot{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px }
.pg-adm-auto-mot li{ display:flex; gap:7px; align-items:flex-start; font-size:var(--t-xs); line-height:1.4; color:var(--tinta-2) }
.pg-adm-auto-mot svg{ flex:0 0 auto; color:var(--mal); margin-top:1px }
.pg-adm-auto-bloq{ display:flex; align-items:center; gap:6px; font-size:var(--t-xs); font-weight:650; color:var(--mal) }
.pg-adm-resi{ display:flex; align-items:center; gap:10px; animation:sube .3s var(--ease) both }
.pg-adm-resi-ico{ flex:0 0 auto; width:30px; height:30px; border-radius:10px; display:grid; place-items:center; background:var(--ok-sup); color:var(--ok) }
.pg-adm-resi-ico.mal{ background:var(--mal-sup); color:var(--mal) } .pg-adm-resi-ico.marca{ background:var(--marca-sup); color:var(--marca-tinta) }
.pg-adm-deshacer{ display:inline-flex; align-items:center; gap:5px; height:30px; padding:0 10px; border:0; border-radius:99px; background:var(--fondo); color:var(--tinta-2);
  font-size:var(--t-xs); font-weight:650; box-shadow:inset 0 0 0 1px var(--linea-2); transition:color .15s, box-shadow .15s }
.pg-adm-deshacer:hover{ color:var(--tinta); box-shadow:inset 0 0 0 1px var(--tinta-3) }
.pg-adm-guia{ counter-reset:paso; gap:12px }
.pg-adm-guia li{ position:relative; padding-left:34px; font-size:var(--t-sm); line-height:1.45; color:var(--marca-tinta) }
.pg-adm-guia li::before{ counter-increment:paso; content:counter(paso); position:absolute; left:0; top:-1px; width:23px; height:23px; border-radius:50%; display:grid; place-items:center;

    reloj:'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7.5V12l3 2'
  };
  const ic = (n, t, sw) => `<svg width="${t||18}" height="${t||18}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||1.9}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${P[n] || ''}"/></svg>`;
  const icA = (n, t) => A.icono(n, t || 18);

  /* ---------- imágenes de muestra (genéricas, sin imitar ningún documento oficial) ---------- */
  const sil = (largo, ovalo) => `<svg viewBox="0 0 40 44" preserveAspectRatio="xMidYMax meet" aria-hidden="true">${largo ? '<path d="M9 23.5C9 12.4 13.4 7.6 20 7.6s11 4.8 11 15.9V35H9z" fill="currentColor" opacity=".5"/>' : ''}<circle cx="20" cy="17.6" r="7.4" fill="currentColor"/><path d="M5 44c0-9.6 6.6-15.2 15-15.2S35 34.4 35 44z" fill="currentColor"/>${ovalo ? '<ellipse cx="20" cy="17.6" rx="11.2" ry="13.6" fill="none" stroke-width=".8" stroke-dasharray="1.8 1.5" style="stroke:var(--marca)"/>' : ''}</svg>`;
  const raya = (x, y, w, c) => `<i${c ? ` class="${c}"` : ''} style="left:${x}%;top:${y}%;width:${w}%"></i>`;
  const MUESTRA = '<span class="pg-adm-muestra">MUESTRA</span>';
  const anverso = tono => `<span class="pg-adm-doc" style="--tono:${tono}"><span class="pg-adm-d-banda"></span>${raya(6,8,26,'b')}${raya(70,8,22,'b')}<span class="pg-adm-d-foto">${sil(false,false)}</span>${raya(40,30,40,'f')}${raya(40,44,50)}${raya(40,56,30)}${raya(40,68,44)}${raya(40,80,24)}${MUESTRA}</span>`;
  const reverso = () => `<span class="pg-adm-doc">${raya(6,12,36)}${raya(6,23,52)}${raya(6,34,28)}${raya(58,12,34)}${raya(58,23,26)}${raya(58,34,20)}<i class="r" style="top:58%"></i><i class="r" style="top:70%"></i><i class="r" style="top:82%"></i>${MUESTRA}</span>`;
  const selfie = (oscura, otra) => `<span class="pg-adm-doc pg-adm-doc-sel${oscura ? ' oscura' : ''}"><span class="pg-adm-d-sil">${sil(otra, true)}</span>${MUESTRA}</span>`;

  /* ---------- sin acceso ---------- */
  if(!A.puede('moderar')){
    const quien = !yo ? 'Ahora mismo no has entrado con ninguna cuenta.'
      : `Has entrado como <b>${esc(yo.n)}</b> (${A.verificado(yo) ? 'cuenta verificada' : 'DNI en revisión'}) y esta cuenta no es del equipo.`;
    raiz.innerHTML = `<section class="contenedor pg-adm-sin">
      <div class="col g16">
        <span class="insignia insignia-tinta" style="align-self:flex-start">${ic('candado',13,2.2)} Zona del equipo</span>
        <h1 class="titular">Esto es solo para el equipo de Apaño</h1>
        <p class="entradilla">Aquí revisamos el documento de identidad de cada alta para que ningún menor de 18 entre en Apaño, y moderamos usuarios, anuncios y reportes. Por eso solo pueden entrar las personas de moderación y administración.</p>
        <p class="sm sec">${quien}</p>
        <div class="fila g10 pg-adm-sin-acc">
          <button class="btn btn-g" type="button" id="pg-adm-perfil">${icA('persona',19)} Cambiar de perfil</button>
          <a class="btn btn-sec btn-g" href="index.html">Volver al inicio</a>
        </div>
        <p class="ayuda">Demostración: en el menú de perfiles elige «Nuria P. · moderación» o «Óscar V. · administración».</p>
      </div>
      <div class="pg-adm-sin-ilus" aria-hidden="true">
        ${anverso('var(--marca-sup)')}
        <span class="pg-adm-sin-sel">${selfie(false,false)}</span>
        <span class="pg-adm-sin-candado">${ic('candado',40,1.7)}</span>
      </div>
    </section>`;
    $('#pg-adm-perfil').addEventListener('click', A.abreCuenta);
    return;
  }

  const esAdmin = A.puede('admin');
  const V = A.VERIFICACIONES;

  /* ---------- estado de la sesión (sessionStorage: dura lo que la pestaña) ---------- */
  const CLAVE = 'apano.moderacion';
  let E = {};
  try{ E = JSON.parse(sessionStorage.getItem(CLAVE)) || {} }catch(e){ E = {} }
  ['ver','usu','anu','rep'].forEach(k => { E[k] = E[k] || {} });
  E.log = E.log || []; E.inv = E.inv || [];
  const AJ0 = {edad:18, docs:{DNI:true, NIE:true, Pasaporte:true}, umbral:85, bloqueo:'24', retencion:'30'};
  E.aj = Object.assign({}, AJ0, E.aj || {}, {edad:18});
  E.aj.docs = Object.assign({}, AJ0.docs, E.aj.docs || {});
  const guarda = () => { try{ sessionStorage.setItem(CLAVE, JSON.stringify(E)) }catch(e){} };

  /* ---------- utilidades de tiempo y texto ---------- */
  const dos = n => String(n).padStart(2, '0');
  const ahora = () => { const d = new Date(); return A.HOY + ' ' + dos(d.getHours()) + ':' + dos(d.getMinutes()) };
  const minutos = s => { const t = s.replace('T', ' '); const [Y,M,D] = t.slice(0,10).split('-').map(Number); const [h,m] = (t.slice(11,16) || '12:00').split(':').map(Number); return Date.UTC(Y, M-1, D, h, m) / 60000 };
  const haceTxt = s => { const d = minutos(ahora()) - minutos(s); if(d < 1) return 'ahora mismo'; if(d < 60) return `hace ${Math.round(d)} min`; if(d < 1440) return `hace ${Math.floor(d/60)} h`; const n = Math.floor(d/1440); return n === 1 ? 'hace 1 día' : `hace ${n} días` };
  const diaTxt = f => { const d = Math.round((minutos(A.HOY) - minutos(f.slice(0,10))) / 1440); return d === 0 ? 'Hoy' : d === 1 ? 'Ayer' : A.fechaCorta(f.slice(0,10)) };
  const envioTxt = s => { const d = diaTxt(s); return (d === 'Hoy' || d === 'Ayer' ? d.toLowerCase() : 'el ' + d) + ' a las ' + s.slice(11,16) };
  const masca = n => n ? n.slice(0,2) + '•'.repeat(Math.max(1, n.length - 4)) + n.slice(-2) : '—';
  const mascaTxt = t => String(t).replace(/\b([XYZ]\d{7}[A-Z]|\d{8}[A-Z])\b/g, masca);
  const pila = s => String(s).split(' ')[0];
  const normal = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const fechaLarga = (() => { const t = new Date(A.HOY + 'T12:00').toLocaleDateString('es-ES', {weekday:'long', day:'numeric', month:'long'}); return t.charAt(0).toUpperCase() + t.slice(1) })();
  const mesTxt = new Date(A.HOY + 'T12:00').toLocaleDateString('es-ES', {month:'long'});
  const BLOQUEO = {'24':'24 horas', '72':'72 horas', '168':'7 días'};
  const RETEN = {'0':'en cuanto se resuelve la solicitud', '30':'a los 30 días', '90':'a los 90 días'};
  const bloqueoTxt = () => BLOQUEO[E.aj.bloqueo] || '24 horas';

  /* ---------- registro ---------- */
  const nuevos = new Set();
  const tipoDe = x => x.tipo || (/identidad|dispositivo|rechazo autom|documento/i.test(x.acc) ? 'identidades' : /mediaci|reporte/i.test(x.acc) ? 'reportes' : /anuncio/i.test(x.acc) ? 'anuncios' : 'otros');
  const todosLog = () => [...E.log, ...A.ACTIVIDAD.map(x => Object.assign({}, x, {tipo:tipoDe(x)}))].sort((a, b) => a.h < b.h ? 1 : a.h > b.h ? -1 : 0);
  const registra = (acc, tipo) => {
    const it = {h:ahora(), quien:yo.n, acc, tipo, s:1, id:Date.now() + '-' + Math.random().toString(36).slice(2,7)};
    E.log.unshift(it); nuevos.add(it.id); guarda();
    pintaRegistro(); if(esAdmin) pintaEquipo();
  };

  /* ---------- identidades: derivados ---------- */
  const RX_PC = /coincidencia(?: facial)? (\d+)\s*%/i;
  const estV = v => (E.ver[v.id] && E.ver[v.id].estado) || v.estado;
  const edadV = v => A.edad(v.nac);
  const menorV = v => edadV(v) < 18;
  const caducado = v => v.cad < A.HOY;
  const coinc = v => { for(const s of v.senales){ const m = s.m.match(RX_PC); if(m) return +m[1] } return null };
  const cuentaDe = v => A.USUARIOS.find(u => u.docNum === v.num);
  const pseudo = v => cuentaDe(v) || {n:v.n, av:A.CATEGORIAS[A.hash(v.id) % A.CATEGORIAS.length].c2};
  const senales = v => {
    const ss = v.senales.map(s => { const m = s.m.match(RX_PC); if(!m) return s; const p = +m[1]; return {t: p >= E.aj.umbral ? 'ok' : p >= 60 ? 'avisa' : 'mal', m:s.m} });
    if(!E.aj.docs[v.doc]) ss.push({t:'mal', m:`Ahora mismo no admitimos ${v.doc === 'Pasaporte' ? 'el pasaporte' : 'el ' + v.doc} como documento`});
    return ss;
  };
  const sugerido = v => { const pc = coinc(v); return menorV(v) ? 'menor' : caducado(v) ? 'caducado' : (pc !== null && pc < 60) ? 'cara' : '' };
  const TONO_DOC = {DNI:'var(--marca-sup)', NIE:'var(--ok-sup)', Pasaporte:'var(--sol-sup)'};

  /* ---------- usuarios, anuncios y reportes: derivados ---------- */
  const estU = u => (E.usu[u.id] && E.usu[u.id].estado) || u.estado;
  const estA = a => (E.anu[a.id] && E.anu[a.id].estado) || a.estado;
  const estR = r => (E.rep[r.id] && E.rep[r.id].estado) || r.estado;
  const abiertoR = r => ['abierto', 'mediacion'].includes(estR(r));
  const menorR = r => /menor/i.test(r.motivo);
  const hace48 = (() => { const d = new Date(A.HOY + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() - 1); return d.toISOString().slice(0,10) })();
  const repAbiertoDe = sid => A.REPORTES.some(r => r.s === sid && abiertoR(r));
  const porRevisar = a => !(E.anu[a.id] && E.anu[a.id].rev) && estA(a) === 'activo' && (a.fecha >= hace48 || repAbiertoDe(a.id));
  const TIPO = {particular:'Particular', profesional:'Profesional', interno:'Equipo'};
  const ROL = {usuario:'Usuario', moderador:'Moderación', admin:'Administración'};
  const insEstado = st => ({
    verificado:'<span class="insignia insignia-ok">Verificado</span>', pendiente:'<span class="insignia insignia-avisa">Pendiente</span>',
    reverificar:'<span class="insignia insignia-avisa">Reverificando</span>', suspendido:'<span class="insignia insignia-mal">Suspendido</span>',
    rechazado:'<span class="insignia insignia-mal">Alta rechazada</span>'})[st] || `<span class="insignia">${esc(st)}</span>`;
  const insR = st => ({abierto:'<span class="insignia insignia-avisa">Abierto</span>', mediacion:'<span class="insignia insignia-marca">En mediación</span>',
    resuelto:'<span class="insignia insignia-ok">Resuelto</span>', descartado:'<span class="insignia">Descartado</span>'})[st] || '';

  /* ---------- cifras de cabecera ---------- */
  const menoresMes = () => {
    const mes = A.HOY.slice(0,7), ids = new Set();
    V.forEach(v => { if(v.f.startsWith(mes) && menorV(v) && (v.estado === 'rechazado-auto' || estV(v) === 'rechazado')) ids.add(v.id) });
    Object.keys(E.ver).forEach(id => { if(E.ver[id].estado === 'rechazado' && E.ver[id].motivo === 'menor') ids.add(id) });
    return ids.size + A.ACTIVIDAD.filter(x => x.h.startsWith(mes) && /bloque[oó] el dispositivo/i.test(x.acc)).length;
  };
  const cifras = () => {
    const pend = V.filter(v => estV(v) === 'pendiente').sort((a, b) => a.f < b.f ? -1 : 1);
    const autoHoy = V.filter(v => v.estado === 'rechazado-auto' && v.f.startsWith(A.HOY));
    const anu = A.ANUNCIOS.filter(porRevisar), reps = A.REPORTES.filter(r => estR(r) === 'abierto');
    return [
      {k:'identidades', n:pend.length, et:'Altas por verificar', sub: pend.length ? `La más antigua llegó ${haceTxt(pend[0].f)}` : 'Cola al día', cls:'prin', ico:ic('carnet',22)},
      {k:'identidades', ancla:'pg-adm-autos', n:autoHoy.length, et:'Rechazos automáticos hoy', sub: autoHoy.length ? autoHoy.map(v => `${pila(v.n)}, ${edadV(v)} años`).join(' · ') : 'Ninguno por ahora', ico:ic('rayo',18)},
      {k:'anuncios', n:anu.length, et:'Anuncios por revisar', sub:'Nuevos en 48 h o con reporte', ico:ic('rejilla',18)},
      {k:'reportes', n:reps.length, et:'Reportes abiertos', sub: reps.length ? reps.map(r => r.motivo).join(' · ') : 'Todo resuelto', ico:ic('bandera',18)},
      {k:'registro', filtro:'identidades', n:menoresMes(), et:'Menores bloqueados', sub:`En ${mesTxt}. Ninguno ha llegado a entrar`, cls:'menor', ico:'18'}
    ];
  };
  const tile = (c, i) => `<button type="button" class="pg-adm-cifra${c.cls ? ' pg-adm-cifra-' + c.cls : ''}" data-cifra="${i}" data-pg="ir" data-tab="${c.k}"${c.ancla ? ` data-ancla="${c.ancla}"` : ''}${c.filtro ? ` data-filtro="${c.filtro}"` : ''}>
      <span class="pg-adm-cifra-ico" aria-hidden="true">${c.ico}</span>
      <span class="pg-adm-cifra-n cifra" data-cuenta="${c.n}">${c.n}</span>
      <span class="pg-adm-cifra-et">${c.et}</span>
      <span class="pg-adm-cifra-sub">${esc(c.sub)}</span>
      ${c.cls === 'prin' ? `<span class="pg-adm-cifra-ir">Revisar ${ic('flecha',15,2.2)}</span>` : ''}
    </button>`;

  /* ---------- pestañas ---------- */
  const TABS = [
    {id:'identidades', t:'Identidades', n:1}, {id:'usuarios', t:'Usuarios'}, {id:'anuncios', t:'Anuncios', n:1},
    {id:'reportes', t:'Reportes', n:1}, {id:'registro', t:'Registro'}
  ].concat(esAdmin ? [{id:'equipo', t:'Equipo'}, {id:'ajustes', t:'Ajustes'}] : []);

  /* ======================================================================
     IDENTIDADES
     ====================================================================== */
  const docWrap = (tipo, id, num) => `<span class="pg-adm-docw"><span class="pg-adm-docnum">${masca(num)}</span><button type="button" class="pg-adm-mostrar" data-pg="mostrar" data-tipo="${tipo}" data-id="${id}" aria-pressed="false" title="Al mostrarlo queda constancia en el registro">${ic('ojo',14,2.1)}<span>Mostrar</span></button></span>`;
  const listaSen = ss => `<ul class="pg-adm-senales">${ss.map(s => `<li class="${s.t}"><span class="pg-adm-sen-ico">${s.t === 'ok' ? icA('check',13) : s.t === 'avisa' ? ic('excl',13,2.8) : icA('cerrar',12)}</span><span><span class="solo-lector">${s.t === 'ok' ? 'Correcto: ' : s.t === 'avisa' ? 'Aviso: ' : 'Problema: '}</span>${esc(s.m)}</span></li>`).join('')}</ul>`;
  const docs = (v, estatico) => {
    const pc = coinc(v), txt = v.senales.map(s => s.m).join(' ');
    const cl = pc === null ? '' : pc >= E.aj.umbral ? 'ok' : pc >= 60 ? 'avisa' : 'mal';
    const tag = estatico ? 'div' : 'button';
    const at = cara => estatico ? '' : ` type="button" data-pg="ver-docs" data-id="${v.id}" aria-label="Ampliar ${cara} de ${esc(v.n)}"`;
    return `<div class="pg-adm-docs${estatico ? ' pg-adm-docs-g' : ''}">
      <${tag} class="pg-adm-img"${at('el anverso del documento')}>${anverso(TONO_DOC[v.doc] || 'var(--sup-3)')}<span class="pg-adm-img-et"><span>Anverso</span>${caducado(v) ? '<span class="pg-adm-et-mal">Caducado</span>' : ''}</span></${tag}>
      <${tag} class="pg-adm-img"${at('el reverso del documento')}>${reverso()}<span class="pg-adm-img-et"><span>Reverso</span></span></${tag}>
      <${tag} class="pg-adm-img pg-adm-img-sel"${at('la selfie')}>${selfie(/poca luz/i.test(txt), pc !== null && pc < 60)}<span class="pg-adm-img-et"><span>Selfie</span>${pc !== null ? `<span class="pg-adm-pc ${cl}">${pc} %</span>` : ''}</span>${pc !== null ? `<span class="pg-adm-medidor ${cl}" style="--p:${pc}%;--u:${E.aj.umbral}%" title="Coincidencia ${pc} %, umbral ${E.aj.umbral} %"><i></i></span>` : ''}</${tag}>
    </div>`;
  };
  const ficha = (v, modo) => {
    const ed = edadV(v), menor = ed < 18, cad = caducado(v), ss = senales(v), pc = coinc(v), auto = modo === 'auto';
    const reparos = cad || ss.some(s => s.t === 'mal');
    const bajo = pc !== null && pc < E.aj.umbral;
    const c18 = (+v.nac.slice(0,4) + 18) + v.nac.slice(4);
    const ins = [
      menor ? `<span class="insignia insignia-mal">${ic('candado',12,2.4)} Menor de edad</span>` : '',
      cad ? '<span class="insignia insignia-mal">Documento caducado</span>' : '',
      bajo ? `<span class="insignia ${pc < 60 ? 'insignia-mal' : 'insignia-avisa'}">Cara ${pc} %</span>` : '',
      auto ? '<span class="insignia insignia-tinta">Rechazo automático</span>' : '',
      !menor && !reparos && !bajo ? `<span class="insignia insignia-ok">${icA('check',12)} Todo en orden</span>` : ''
    ].join('');
    const aprobar = menor
      ? `<button class="btn pg-adm-aprobar" type="button" disabled aria-describedby="pg-adm-x-${v.id}">${ic('candado',17)} Aprobar</button><p class="pg-adm-exp" id="pg-adm-x-${v.id}">${ic('candado',15,2.2)} No se puede aprobar a un menor de edad</p>`
      : `<button class="btn pg-adm-aprobar" type="button" data-pg="aprobar" data-id="${v.id}">${icA('check',18)} ${auto ? 'Anular el rechazo y aprobar…' : reparos ? 'Aprobar…' : 'Aprobar'}</button>`;
    return `<article class="pg-adm-ficha${menor ? ' menor' : ''}" id="pg-adm-${auto ? 'd' : 'f'}-${v.id}" aria-labelledby="pg-adm-fn-${v.id}">
      ${menor ? `<div class="pg-adm-banda">${ic('candado',16,2.2)}<span>Menor de edad, ${ed} años. No puede entrar en Apaño.</span></div>` : ''}
      <header class="pg-adm-ficha-cab">
        ${A.avatar(pseudo(v))}
        <div class="crecer min0">
          <h3 class="pg-adm-ficha-n" id="pg-adm-fn-${v.id}">${esc(v.n)}</h3>
          <p class="pg-adm-meta">${esc(v.ciudad)} · ${v.doc} · enviada ${envioTxt(v.f)} <span class="ter">(${haceTxt(v.f)})</span></p>
        </div>
        <div class="pg-adm-ins">${ins}</div>
      </header>
      <div class="pg-adm-ficha-cuerpo">
        ${docs(v, auto)}
        <div class="col g16 min0">
          <div class="pg-adm-edad${menor ? ' mal' : ''}">
            <span class="pg-adm-edad-n cifra" aria-label="${ed} años">${ed}</span>
            <span class="col min0"><span class="pg-adm-edad-u">años · ${menor ? 'menor de edad' : 'mayor de edad'}</span><span class="pg-adm-edad-s">${menor ? 'Cumplirá 18 el ' : 'Cumplió 18 el '}${A.fecha(c18)}</span></span>
            <span class="pg-adm-edad-ico">${menor ? ic('candado',20,2.1) : icA('check',20)}</span>
          </div>
          <dl class="pg-adm-dl">
            <div class="ancho"><dt>Número de ${v.doc}</dt><dd>${docWrap('v', v.id, v.num)}</dd></div>
            <div><dt>Nacimiento</dt><dd>${A.fecha(v.nac)}</dd></div>
            <div><dt>Caducidad</dt><dd class="${cad ? 'pg-adm-mal' : ''}">${A.fecha(v.cad)}${cad ? ' · caducado' : ''}</dd></div>
          </dl>
          <div class="col g8"><h4 class="etiqueta">Comprobaciones automáticas</h4>${listaSen(ss)}</div>
        </div>
      </div>
      <footer class="pg-adm-ficha-acc">
        ${aprobar}
        <button class="btn btn-sec" type="button" data-pg="foto" data-id="${v.id}">${ic('camara',17)} Pedir otra foto</button>
        <button class="btn ${menor ? 'btn-peligro' : 'btn-sec pg-adm-btn-mal'}" type="button" data-pg="rechazar" data-id="${v.id}">${icA('cerrar',17)} ${auto ? 'Confirmar rechazo' : 'Rechazar'}</button>
      </footer>
    </article>`;
  };
  const autoItem = v => {
    const ed = edadV(v), mal = v.senales.filter(s => s.t === 'mal');
    return `<li class="pg-adm-auto${ed < 18 ? ' menor' : ''}" id="pg-adm-a-${v.id}">
      <div class="fila g10">${A.avatar(pseudo(v), 'avatar-p')}<div class="crecer min0 col"><b class="sm">${esc(v.n)}</b><span class="xs ter">${esc(v.ciudad)} · ${envioTxt(v.f)}</span></div><span class="pg-adm-auto-edad" aria-label="${ed} años"><b class="cifra">${ed}</b>años</span></div>
      <ul class="pg-adm-auto-mot">${mal.map(s => `<li>${icA('cerrar',12)}<span>${esc(s.m)}</span></li>`).join('')}</ul>
      ${ed < 18 ? `<p class="pg-adm-auto-bloq">${ic('candado',13,2.2)} Dispositivo bloqueado ${bloqueoTxt()}</p>` : ''}
      <button class="btn btn-sec btn-p btn-bloque" type="button" data-pg="revisar-auto" data-id="${v.id}">Revisar la ficha</button>
    </li>`;
  };
  const EST_V = {aprobado:['Aprobada','ok'], rechazado:['Rechazada','mal'], 'otra-foto':['Foto pedida','marca']};
  const resItem = v => {
    const r = E.ver[v.id], e = EST_V[r.estado] || ['Resuelta','ok'];
    const icono = r.estado === 'aprobado' ? icA('check',15) : r.estado === 'rechazado' ? icA('cerrar',14) : ic('camara',15);
    return `<li class="pg-adm-resi"><span class="pg-adm-resi-ico ${e[1]}">${icono}</span><div class="crecer min0 col"><b class="sm">${esc(v.n)}</b><span class="xs ter">${e[0]} a las ${r.h.slice(11)} · ${esc(pila(r.por))}</span></div><button class="pg-adm-deshacer" type="button" data-pg="devolver" data-id="${v.id}" aria-label="Deshacer y devolver a la cola la solicitud de ${esc(v.n)}">${ic('deshacer',14)}Deshacer</button></li>`;
  };
  const panelIdentidades = () => `
    <div class="con-lateral">
      <div class="min0">
        <div class="pg-adm-pcab">
          <div class="col g6"><h2 class="h2">Cola de identidades</h2><p class="sm sec">Por orden de llegada; las de menores, arriba del todo. Comprueba la edad, la caducidad y que la cara cuadra. El número del documento sale enmascarado: si lo muestras, queda en el registro.</p></div>
          <a class="pg-adm-salto" href="#pg-adm-autos" data-pg="ir-autos">${ic('rayo',15)}<span id="pg-adm-autos-n2"></span></a>
        </div>
        <div class="pg-adm-cola" id="pg-adm-cola"></div>
      </div>
      <aside class="col g16 pg-adm-lat" aria-label="Más sobre identidades">
        <section class="pg-adm-lat-b" id="pg-adm-autos" aria-labelledby="pg-adm-autos-t">
          <div class="fila entre g8"><h3 class="pg-adm-lat-t" id="pg-adm-autos-t">Rechazadas automáticamente</h3><span class="insignia insignia-mal" id="pg-adm-autos-n">0</span></div>
          <p class="xs sec">El sistema las ha parado antes de llegar a la cola. Repásalas por si hubiera un error y confirma el rechazo.</p>
          <ul class="pg-adm-autos" id="pg-adm-autos-l"></ul>
        </section>
        <section class="pg-adm-lat-b sup" id="pg-adm-res" aria-labelledby="pg-adm-res-t" hidden>
          <div class="fila entre g8"><h3 class="pg-adm-lat-t" id="pg-adm-res-t">Resueltas en esta sesión</h3><span class="insignia" id="pg-adm-res-n">0</span></div>
          <ul class="pg-adm-resl" id="pg-adm-res-l"></ul>
        </section>
        <section class="pg-adm-lat-b bloque-marca" aria-labelledby="pg-adm-guia-t">
          <h3 class="pg-adm-lat-t" id="pg-adm-guia-t" style="color:var(--marca-tinta)">Antes de aprobar</h3>
          <ol class="pg-adm-guia">
            <li>Tiene <b>18 años o más</b>. Si no, se rechaza: no hay excepciones.</li>
            <li>El documento está <b>en vigor</b> y es DNI, NIE o pasaporte.</li>
            <li>La selfie es la misma persona: coincidencia del <b id="pg-adm-guia-u">${E.aj.umbral} %</b> o más.</li>
            <li>Nada tapado, recortado ni retocado.</li>
          </ol>
        </section>
      </aside>
    </div>`;
  const pintaCola = () => {
    const pend = V.filter(v => estV(v) === 'pendiente').sort((a, b) => (menorV(b) - menorV(a)) || (a.f < b.f ? -1 : 1));
    $('#pg-adm-cola').innerHTML = pend.length ? pend.map(v => ficha(v, 'cola')).join('')
      : `<div class="pg-adm-vacio"><span class="pg-adm-vacio-ico">${icA('check',28)}</span><h3 class="h3">Cola al día</h3><p class="sm sec" style="max-width:40ch">No queda ninguna alta por revisar. Las nuevas aparecerán aquí por orden de llegada.</p></div>`;
    const au = V.filter(v => estV(v) === 'rechazado-auto');
    $('#pg-adm-autos-l').innerHTML = au.length ? au.map(autoItem).join('') : '<li class="sm ter">No queda ninguna por repasar.</li>';
    $('#pg-adm-autos-n').textContent = au.length; $('#pg-adm-autos-n2').textContent = au.length === 1 ? '1 rechazo automático' : `${au.length} rechazos automáticos`;
    $('.pg-adm-salto').style.visibility = au.length ? '' : 'hidden';
    const res = V.filter(v => E.ver[v.id]).sort((a, b) => E.ver[a.id].h < E.ver[b.id].h ? 1 : -1);
    $('#pg-adm-res').hidden = !res.length;
    $('#pg-adm-res-n').textContent = res.length;
    $('#pg-adm-res-l').innerHTML = res.map(resItem).join('');
    const g = $('#pg-adm-guia-u'); if(g) g.textContent = E.aj.umbral + ' %';
  };

  /* salida animada de una ficha */
  const sale = (el, sello, cb) => {
    if(!el){ cb(); return }
    if(sello) el.insertAdjacentHTML('beforeend', `<div class="pg-adm-sello ${sello.tono}" aria-hidden="true"><span>${sello.ico}${sello.t}</span></div>`);
    requestAnimationFrame(() => el.classList.add('resuelta'));
    setTimeout(() => {
      el.style.height = el.offsetHeight + 'px'; el.style.overflow = 'hidden';
      void el.offsetHeight;
      el.classList.add('sale'); el.style.height = '0px';
      setTimeout(cb, quieto ? 0 : 420);
    }, quieto ? 0 : (sello ? 700 : 0));
  };
  const resolverV = (v, r, texto, sello) => {
    const u = cuentaDe(v);
    r.por = yo.n; r.h = ahora();
    if(u){ r.prevU = E.usu[u.id] || null; E.usu[u.id] = {estado: r.estado === 'aprobado' ? 'verificado' : r.estado === 'rechazado' ? 'rechazado' : 'pendiente'} }
    E.ver[v.id] = r; guarda();
    registra(texto, 'identidades');
    sale($('#pg-adm-f-' + v.id) || $('#pg-adm-a-' + v.id), sello, () => { pintaCola(); pintaUsuarios(); pintaCifras() });
  };

  /* mostrar el número completo (deja constancia) */
  const relojes = {};
  const tapaDoc = (b, num) => { const w = b.closest('.pg-adm-docw'); w.classList.remove('abierta'); w.querySelector('.pg-adm-docnum').textContent = masca(num); b.setAttribute('aria-pressed', 'false'); b.innerHTML = ic('ojo',14,2.1) + '<span>Mostrar</span>' };
  const alternaDoc = b => {
    const k = b.dataset.tipo + ':' + b.dataset.id;
    const p = b.dataset.tipo === 'u' ? A.usuario(b.dataset.id) : V.find(v => v.id === b.dataset.id);
    const num = b.dataset.tipo === 'u' ? p.docNum : p.num;
    clearTimeout(relojes[k]);
    if(b.getAttribute('aria-pressed') === 'true'){ tapaDoc(b, num); return }
    const w = b.closest('.pg-adm-docw');
    w.querySelector('.pg-adm-docnum').textContent = num;
    w.classList.remove('abierta'); void w.offsetWidth; w.classList.add('abierta');
    b.setAttribute('aria-pressed', 'true'); b.innerHTML = ic('ojoNo',14,2.1) + '<span>Ocultar</span>';
    registra(`Vio el número de documento de ${p.n}`, 'identidades');
    relojes[k] = setTimeout(() => { if(document.contains(b)) tapaDoc(b, num) }, 30000);
  };

  const verDocs = v => A.dialogo(`<div class="dialogo-cuerpo col g16" style="padding-top:24px">
      <div class="col g4 pg-adm-hoja-cab"><span class="etiqueta">Documento de ${esc(v.n)}</span><h2 class="h2">${v.doc} <span class="pg-adm-mono">${masca(v.num)}</span></h2></div>
      ${docs(v, true)}
      <p class="aviso">${icA('escudo',18)}<span>Imágenes de <b>muestra</b>. En la app real verías las fotos que ha enviado la persona. Solo las ve el equipo de verificación y nunca se publican.</span></p>
    </div>`, {ancho:720});

  const fichaAuto = v => A.dialogo(ficha(v, 'auto'), {ancho:900});

  const aprobar = v => {
    if(menorV(v)){ A.avisa('No se puede aprobar a un menor de edad', 'mal'); return }
    const probs = [];
    if(caducado(v)) probs.push(`El documento caducó el ${A.fecha(v.cad)}`);
    senales(v).filter(s => s.t === 'mal' && !/caducad/i.test(s.m)).forEach(s => probs.push(s.m));
    const auto = v.estado === 'rechazado-auto';
    const hazlo = () => {
      resolverV(v, {estado:'aprobado'}, `Aprobó la identidad de ${v.n} (${v.doc} ${masca(v.num)})${probs.length ? ' con reparos: ' + probs[0].charAt(0).toLowerCase() + probs[0].slice(1) : ''}`, {t:'Aprobada', tono:'ok', ico:icA('check',22)});
      A.avisa(`Identidad de ${pila(v.n)} aprobada`);
    };
    if(!probs.length && !auto){ hazlo(); return }
    A.dialogo(`<form class="dialogo-cuerpo col g16 pg-adm-hoja" novalidate>
      <div class="col g8 pg-adm-hoja-cab">
        <span class="insignia insignia-avisa" style="align-self:flex-start">${ic('excl',13,2.8)} Aprobación con reparos</span>
        <h2 class="h2">${caducado(v) ? `¿Aprobar a ${esc(pila(v.n))} con el documento caducado?` : auto ? `¿Anular el rechazo de ${esc(pila(v.n))}?` : `¿Aprobar a ${esc(pila(v.n))} pese a las alertas?`}</h2>
        <p class="sm sec">Hazlo solo si lo has comprobado a mano. Quedará en el registro con tu nombre.</p>
      </div>
      ${probs.length ? listaSen(probs.map(m => ({t:'mal', m}))) : ''}
      <label class="casilla" for="pg-adm-conf"><input type="checkbox" id="pg-adm-conf" aria-describedby="pg-adm-conf-e"><span>He revisado el documento y la selfie, y confirmo que ${esc(pila(v.n))} es mayor de edad y es quien dice ser.</span></label>
      <p class="error" id="pg-adm-conf-e" hidden>Marca la casilla para poder aprobar.</p>
      <div class="pg-adm-hoja-acc"><button type="button" class="btn btn-sec" data-cerrar>Cancelar</button><button type="submit" class="btn">${icA('check',18)} Aprobar igualmente</button></div>
    </form>`, {ancho:520, alAbrir:(capa, cerrar) => {
      const f = $('form', capa), c = $('#pg-adm-conf', capa);
      c.addEventListener('change', () => { if(c.checked){ c.removeAttribute('aria-invalid'); $('#pg-adm-conf-e', capa).hidden = true } });
      f.addEventListener('submit', e => {
        e.preventDefault();
        if(!c.checked){ c.setAttribute('aria-invalid', 'true'); $('#pg-adm-conf-e', capa).hidden = false; c.focus(); return }
        cerrar(); hazlo();
      });
    }});
  };

  const MOTIVOS_V = [
    ['ilegible', 'Documento ilegible', 'Borroso, cortado o con reflejos'],
    ['caducado', 'Documento caducado', 'La fecha de validez ya ha pasado'],
    ['cara', 'La cara no coincide', 'La selfie no es la persona del documento'],
    ['manipulado', 'Documento manipulado', 'Datos tapados, editados o fotocopia'],
    ['menor', 'Menor de edad', 'Tiene menos de 18 años'],
    ['otro', 'Otro motivo', 'Explícalo en la nota']
  ];
  const rechazar = v => {
    const sug = sugerido(v), auto = v.estado === 'rechazado-auto', nom = pila(v.n);
    A.dialogo(`<form class="dialogo-cuerpo col g16 pg-adm-hoja" novalidate>
      <div class="col g6 pg-adm-hoja-cab">
        <span class="etiqueta">${auto ? 'Confirmar rechazo automático' : 'Rechazar identidad'}</span>
        <h2 class="h2">¿Por qué rechazas a ${esc(nom)}?</h2>
        <p class="sm sec">Le explicaremos el motivo para que sepa qué hacer. Queda en el registro con tu nombre.</p>
      </div>
      <fieldset class="pg-adm-opciones dos" role="radiogroup" aria-describedby="pg-adm-m-e">
        <legend class="solo-lector">Motivo del rechazo (obligatorio)</legend>
        ${MOTIVOS_V.map(([k, t, d]) => `<label class="opcion${k === 'menor' ? ' pg-adm-op-menor' : ''}" for="pg-adm-m-${k}"><input type="radio" name="motivo" id="pg-adm-m-${k}" value="${k}"${auto && sug === k ? ' checked' : ''}><span class="col g2 min0"><span class="negrita fila g6">${t}${sug === k ? '<span class="insignia insignia-marca">Sugerido</span>' : ''}</span><span class="ayuda">${d}</span></span></label>`).join('')}
      </fieldset>
      <p class="error" id="pg-adm-m-e" hidden>Elige un motivo.</p>
      <div class="aviso aviso-mal" id="pg-adm-m-av" hidden>${ic('candado',18,2.1)}<span><b>Menor de edad.</b> Bloquearemos su dispositivo ${bloqueoTxt()} y no podrá volver a intentarlo con este documento. Las imágenes se borran ${RETEN[E.aj.retencion]}.</span></div>
      <div class="campo"><label for="pg-adm-m-nota">Nota para el registro <span class="ter" id="pg-adm-m-op">(opcional)</span></label><textarea class="ent" id="pg-adm-m-nota" rows="3" placeholder="Qué has visto. No escribas el número del documento." aria-describedby="pg-adm-m-ne"></textarea><p class="error" id="pg-adm-m-ne" hidden>Explica el motivo en la nota.</p></div>
      <div class="pg-adm-hoja-acc"><button type="button" class="btn btn-sec" data-cerrar>Cancelar</button><button type="submit" class="btn btn-peligro">${icA('cerrar',17)} ${auto ? 'Confirmar rechazo' : 'Rechazar identidad'}</button></div>
    </form>`, {ancho:600, alAbrir:(capa, cerrar) => {
      const f = $('form', capa), grupo = $('fieldset', capa), err = $('#pg-adm-m-e', capa), nota = $('#pg-adm-m-nota', capa), ne = $('#pg-adm-m-ne', capa);
      const sel = () => (f.querySelector('input[name="motivo"]:checked') || {}).value;
      const cambia = () => { const m = sel(); $('#pg-adm-m-av', capa).hidden = m !== 'menor'; $('#pg-adm-m-op', capa).textContent = m === 'otro' ? '(obligatoria)' : '(opcional)'; if(m){ err.hidden = true; grupo.removeAttribute('aria-invalid') } };
      f.addEventListener('change', cambia); cambia();
      f.addEventListener('submit', e => {
        e.preventDefault();
        const m = sel(), n = nota.value.trim();
        ne.hidden = true; nota.removeAttribute('aria-invalid');
        if(!m){ err.textContent = 'Elige un motivo.'; err.hidden = false; grupo.setAttribute('aria-invalid', 'true'); f.querySelector('input[name="motivo"]').focus(); return }
        if(m === 'menor' && !menorV(v)){ err.textContent = `Según el documento tiene ${edadV(v)} años. Si crees que no es suyo, elige «La cara no coincide» o «Documento manipulado».`; err.hidden = false; grupo.setAttribute('aria-invalid', 'true'); return }
        if(m === 'otro' && n.length < 4){ ne.hidden = false; nota.setAttribute('aria-invalid', 'true'); nota.focus(); return }
        cerrar();
        const t = MOTIVOS_V.find(x => x[0] === m)[1];
        resolverV(v, {estado:'rechazado', motivo:m, nota:n}, `${auto ? 'Confirmó el rechazo automático de' : 'Rechazó la identidad de'} ${v.n}: ${t.toLowerCase()}${n ? ` («${n}»)` : ''}`, {t:'Rechazada', tono:'mal', ico:icA('cerrar',20)});
        if(m === 'menor') registra(`Bloqueó el dispositivo de ${v.n} durante ${bloqueoTxt()}: intento de alta de un menor de edad`, 'identidades');
        A.avisa(m === 'menor' ? `${nom} no entra: menor de edad` : `Identidad de ${nom} rechazada`);
      });
    }});
  };

  const FOTOS = {anverso:'anverso del documento', reverso:'reverso del documento', selfie:'selfie'};
  const otraFoto = v => {
    const txt = v.senales.map(s => s.m).join(' '), cad = caducado(v), nom = pila(v.n);
    const pre = {anverso: cad || /ilegible|borros/i.test(txt), reverso: cad, selfie: /luz|coincid/i.test(txt)};
    if(!pre.anverso && !pre.reverso && !pre.selfie) pre.anverso = true;
    const msg = cad ? `Hola, ${nom}. Tu ${v.doc} caducó el ${A.fecha(v.cad)}. Para verificar tu cuenta, sube las dos caras de un documento en vigor (DNI, NIE o pasaporte). Solo lo verá el equipo de verificación.`
      : pre.selfie ? `Hola, ${nom}. No hemos podido comparar bien tu selfie con la foto del documento. Repítela de frente, con buena luz y sin gafas de sol ni gorra. Solo la verá el equipo de verificación.`
      : `Hola, ${nom}. La foto de tu documento no se lee bien. Repítela entera, sin reflejos y con buena luz. Solo la verá el equipo de verificación.`;
    A.dialogo(`<form class="dialogo-cuerpo col g16 pg-adm-hoja" novalidate>
      <div class="col g6 pg-adm-hoja-cab"><span class="etiqueta">Pedir otra foto</span><h2 class="h2">¿Qué tiene que repetir ${esc(nom)}?</h2><p class="sm sec">La solicitud sale de la cola hasta que suba las fotos nuevas.</p></div>
      <fieldset class="pg-adm-opciones tres" aria-describedby="pg-adm-fo-e">
        <legend class="solo-lector">Fotos que tiene que repetir</legend>
        ${Object.keys(FOTOS).map(k => `<label class="opcion" for="pg-adm-fo-${k}"><input type="checkbox" name="que" id="pg-adm-fo-${k}" value="${k}"${pre[k] ? ' checked' : ''}><span class="negrita">${FOTOS[k].charAt(0).toUpperCase() + FOTOS[k].slice(1)}</span></label>`).join('')}
      </fieldset>
      <p class="error" id="pg-adm-fo-e" hidden>Marca al menos una foto.</p>
      <div class="campo"><label for="pg-adm-fo-msg">Mensaje para ${esc(nom)}</label><textarea class="ent" id="pg-adm-fo-msg" rows="5" aria-describedby="pg-adm-fo-ay">${esc(msg)}</textarea><p class="ayuda" id="pg-adm-fo-ay">Le llegaría por correo y como aviso en la app. En esta demostración no se envía nada.</p></div>
      <div class="pg-adm-hoja-acc"><button type="button" class="btn btn-sec" data-cerrar>Cancelar</button><button type="submit" class="btn">${ic('camara',17)} Pedir la foto</button></div>
    </form>`, {ancho:600, alAbrir:(capa, cerrar) => {
      const f = $('form', capa), grupo = $('fieldset', capa), msgEl = $('#pg-adm-fo-msg', capa);
      f.addEventListener('change', () => { if(f.querySelector('input[name="que"]:checked')){ $('#pg-adm-fo-e', capa).hidden = true; grupo.removeAttribute('aria-invalid') } });
      f.addEventListener('submit', e => {
        e.preventDefault();
        const que = $$('input[name="que"]:checked', f).map(i => i.value);
        if(!que.length){ $('#pg-adm-fo-e', capa).hidden = false; grupo.setAttribute('aria-invalid', 'true'); f.querySelector('input[name="que"]').focus(); return }
        if(msgEl.value.trim().length < 10){ msgEl.setAttribute('aria-invalid', 'true'); msgEl.focus(); return }
        cerrar();
        resolverV(v, {estado:'otra-foto', que}, `Pidió a ${v.n} una foto nueva: ${que.map(q => FOTOS[q]).join(', ')}`, {t:'Foto pedida', tono:'marca', ico:ic('camara',20)});
        A.avisa(`Petición preparada para ${nom}`);
      });
    }});
  };

  const devolver = v => {
    const r = E.ver[v.id]; if(!r) return;
    const u = cuentaDe(v);
    if(u){ if(r.prevU) E.usu[u.id] = r.prevU; else delete E.usu[u.id] }
    delete E.ver[v.id]; guarda();
    registra(`Devolvió a ${v.estado === 'rechazado-auto' ? 'rechazadas automáticamente' : 'la cola'} la solicitud de ${v.n}`, 'identidades');
    pintaCola(); pintaUsuarios(); pintaCifras();
    A.avisa(`${pila(v.n)} vuelve a la cola`);
  };

  /* ======================================================================
     USUARIOS
     ====================================================================== */
  const fU = {q:'', e:'', t:'', r:''};
  const accU = (u, enHoja) => {
    const st = estU(u);
    if(u.id === yo.id) return '<span class="xs ter">Es tu cuenta</span>';
    if(u.tipo === 'interno' && !esAdmin) return '<span class="xs ter">Solo administración</span>';
    const b = (acc, icono, t, lab, cls) => enHoja
      ? `<button type="button" class="btn btn-sec${cls === 'mal' ? ' pg-adm-btn-mal' : ''}" data-pg="${acc}" data-id="${u.id}">${icono} ${t}</button>`
      : `<button type="button" class="ico-btn pg-adm-mb${cls ? ' ' + cls : ''}" data-pg="${acc}" data-id="${u.id}" aria-label="${lab} a ${esc(u.n)}" title="${lab}">${icono}<span class="txt">${t}</span></button>`;
    let h = '';
    if(st === 'suspendido') h += b('u-reactivar', ic('reactivar',17), 'Reactivar', 'Reactivar la cuenta');
    else if(st !== 'rechazado') h += b('u-suspender', ic('prohibido',17), 'Suspender', 'Suspender la cuenta', 'mal');
    if(st === 'verificado') h += b('u-reverificar', ic('carnet',17), 'Reverificar', 'Pedir que verifique otra vez su identidad');
    return h;
  };
  const filaU = u => {
    const ed = A.edad(u.nac), menor = ed < 18, st = estU(u);
    return `<tr class="${menor ? 'menor' : ''}${st === 'suspendido' ? ' susp' : ''}" id="pg-adm-u-${u.id}">
      <td class="c-quien"><div class="pg-adm-quien">${A.avatar(u)}<div class="min0"><b>${esc(u.n)}${u.id === yo.id ? ' <span class="insignia insignia-marca">Tú</span>' : ''}</b><small>${TIPO[u.tipo]} · ${ROL[u.rol]}</small></div></div></td>
      <td data-et="Ciudad">${esc(u.ciudad)}<span class="pg-adm-sub">${esc(u.barrio)}</span></td>
      <td data-et="Edad" class="der num">${menor ? `<span class="insignia insignia-mal">${ed} · menor</span>` : ed}</td>
      <td data-et="Documento"><span class="pg-adm-mono sm">${u.doc} ${masca(u.docNum)}</span></td>
      <td data-et="Estado">${insEstado(st)}</td>
      <td data-et="Valoración">${u.resenas ? `<span class="fila g4" style="flex-wrap:nowrap"><span class="estrellas">${icA('estrella',13).replace('fill="none"', 'fill="currentColor"')}</span><b class="num">${u.val.toLocaleString('es-ES', {minimumFractionDigits:1})}</b><span class="ter num">(${u.resenas})</span></span>` : '<span class="ter">Sin reseñas</span>'}</td>
      <td data-et="Alta">${A.fecha(u.alta)}</td>
      <td class="c-acc"><div class="pg-adm-acc-fila"><button type="button" class="btn btn-sec btn-p" data-pg="u-ficha" data-id="${u.id}">Ver ficha</button>${accU(u)}</div></td>
    </tr>`;
  };
  const panelUsuarios = () => `
    <div class="pg-adm-pcab"><div class="col g6"><h2 class="h2">Usuarios</h2><p class="sm sec">Cada cuenta con su edad según el documento. Cualquier menor aparecería en rojo y arriba del todo.</p></div><span class="sm ter" id="pg-adm-u-n" aria-live="polite"></span></div>
    <div id="pg-adm-u-aviso" class="pg-adm-aviso"></div>

    <div class="pg-adm-vacio" id="pg-adm-u-vacio" hidden><h3 class="h3">Nadie con esos filtros</h3><p class="sm sec">Prueba con otra búsqueda o quita algún filtro.</p><button type="button" class="btn btn-sec btn-p" data-pg="u-limpia">Quitar filtros</button></div>`;
  const pintaUsuarios = () => {
    const q = normal(fU.q.trim());
    const l = A.USUARIOS.filter(u => {
      const st = estU(u), stF = st === 'reverificar' ? 'pendiente' : st;
      return (!fU.e || stF === fU.e) && (!fU.t || u.tipo === fU.t) && (!fU.r || u.rol === fU.r) && (!q || normal(`${u.n} ${u.ciudad} ${u.barrio}`).includes(q));

    $('#pg-adm-u-vacio').hidden = !!l.length;

    $('#pg-adm-u-n').textContent = l.length === A.USUARIOS.length ? `${l.length} cuentas` : `${l.length} de ${A.USUARIOS.length} cuentas`;
    const menores = A.USUARIOS.filter(u => A.edad(u.nac) < 18 && estU(u) !== 'suspendido');
    $('#pg-adm-u-aviso').innerHTML = menores.length
      ? `<div class="aviso aviso-mal">${ic('candado',18,2.1)}<span><b>${menores.length === 1 ? 'Hay una cuenta' : `Hay ${menores.length} cuentas`} de menores de edad.</b> Suspéndelas ahora y pide que verifiquen de nuevo su identidad.</span></div>`

  };
  const marcaFila = id => { const f = $('#pg-adm-u-' + id); if(f){ f.classList.remove('flash'); void f.offsetWidth; f.classList.add('flash') } };

  const fichaU = u => {
    const st = estU(u), ed = A.edad(u.nac), anu = A.anunciosDe(u.id);
    const hist = todosLog().filter(x => x.acc.includes(u.n) || x.acc.includes(u.corto)).slice(0, 4);
    const VER = {email:'Correo', tel:'Móvil', dni:'Documento', selfie:'Selfie'};
    A.dialogo(`<div class="dialogo-cuerpo col g16 pg-adm-hoja">
      <div class="fila g16 pg-adm-hoja-cab" style="flex-wrap:nowrap">${A.avatar(u, 'avatar-g')}<div class="col g6 min0"><h2 class="h2">${esc(u.n)}</h2><div class="fila g6">${insEstado(st)}<span class="insignia">${TIPO[u.tipo]}</span>${u.rol !== 'usuario' ? `<span class="insignia insignia-tinta">${ROL[u.rol]}</span>` : ''}</div></div></div>
      ${ed < 18 ? `<div class="aviso aviso-mal">${ic('candado',18,2.1)}<span><b>Menor de edad (${ed} años).</b> No puede tener cuenta en Apaño: suspéndela ya.</span></div>` : ''}

      <div class="pg-adm-hoja-acc">${u.tipo !== 'interno' ? `<a class="btn btn-sec" href="perfil.html?id=${u.id}">Perfil público</a>` : ''}${accU(u, true)}</div>
    </div>`, {ancho:580});
  };

  const MOTIVOS_U = [['pagos', 'Pide pagos fuera de la app'], ['trato', 'Trato inadecuado o acoso'], ['menor', 'Sospecha de que es menor de edad'], ['suplanta', 'Suplanta a otra persona'], ['enganoso', 'Anuncios engañosos o spam'], ['otro', 'Otro motivo']];

      <div class="campo"><label for="pg-adm-s-m">Motivo</label><select class="ent" id="pg-adm-s-m" aria-describedby="pg-adm-s-me"><option value="">Elige un motivo</option>${MOTIVOS_U.map(([k, t]) => `<option value="${k}">${t}</option>`).join('')}</select><p class="error" id="pg-adm-s-me" hidden>Elige un motivo.</p></div>
      <div class="aviso aviso-mal" id="pg-adm-s-menor" hidden>${ic('candado',18,2.1)}<span>Además le pediremos que vuelva a verificar su identidad con el documento y una selfie.</span></div>
      <div class="campo"><label for="pg-adm-s-n">Nota para el registro <span class="ter" id="pg-adm-s-op">(opcional)</span></label><textarea class="ent" id="pg-adm-s-n" rows="3" aria-describedby="pg-adm-s-ne"></textarea><p class="error" id="pg-adm-s-ne" hidden>Explica el motivo en la nota.</p></div>

      <div class="pg-adm-hoja-acc"><button type="button" class="btn btn-sec" data-cerrar>Cancelar</button><button type="submit" class="btn btn-peligro">${ic('prohibido',17)} Suspender cuenta</button></div>
    </form>`, {ancho:540, alAbrir:(capa, cerrar) => {

        registra(`Suspendió la cuenta de ${u.n}: ${MOTIVOS_U.find(x => x[0] === m)[1].toLowerCase()}${n ? ` («${n}»)` : ''}`, 'usuarios');

  };
  const reactivar = u => {

  /* ======================================================================

  const fA = {est:'todos', cat:''};

  const pasaA = (a, est) => { const st = estA(a); return est === 'todos' ? st !== 'eliminado' : est === 'revisar' ? porRevisar(a) : st === est };
  const itemA = a => {
    const st = estA(a), rev = porRevisar(a), reps = A.REPORTES.filter(r => r.s === a.id && abiertoR(r)).length, d = E.anu[a.id] || {};
    const ins = st === 'eliminado' ? '<span class="insignia insignia-mal">Eliminado</span>' : st === 'oculto' ? `<span class="insignia insignia-tinta">${ic('ojoNo',12,2.2)} Oculto</span>`

    const bot = st === 'eliminado' ? b('a-restaurar', ic('deshacer',17), 'Restaurar')
      : (rev ? b('a-revisado', icA('check',17), 'Dar por revisado', 'ok') : '')
        + (st === 'oculto' ? b('a-mostrar', ic('ojo',17), 'Volver a mostrar') : b('a-ocultar', ic('ojoNo',17), 'Ocultar'))

    return `<div class="pg-adm-anu ${st}${rev ? ' revisar' : ''}" id="pg-adm-an-${a.id}">

  };
  const panelAnuncios = () => `
    <div class="pg-adm-pcab"><div class="col g6"><h2 class="h2">Anuncios</h2><p class="sm sec">Primero los nuevos y los reportados. Ocultar se deshace con un toque; eliminar se puede restaurar desde «Eliminados».</p></div></div>
    <div class="pg-adm-afil">
      <div class="chips" id="pg-adm-a-est" role="group" aria-label="Filtrar por estado">${EST_A.map(([k, t]) => `<button class="chip" type="button" data-est="${k}" aria-pressed="${k === fA.est}">${t} <span class="pg-adm-chip-n">0</span></button>`).join('')}</div>
      <div class="campo"><label class="solo-lector" for="pg-adm-a-cat">Categoría</label><select class="ent" id="pg-adm-a-cat"><option value="">Todas las categorías</option>${A.CATEGORIAS.map(c => `<option value="${c.id}">${c.n}</option>`).join('')}</select></div>

  const pintaChipsA = () => $$('#pg-adm-a-est .chip').forEach(c => {
