            <label class="solo-lector" for="pg-adm-aj-edad">Edad mínima en años (bloqueada)</label>
            <div class="pg-adm-bloq"><input class="ent" id="pg-adm-aj-edad" value="18 años" disabled aria-describedby="pg-adm-aj-edad-n">${ic('candado',18,2.1)}</div>
            <p class="ayuda" id="pg-adm-aj-edad-n"><b>Nota legal.</b> En España la mayoría de edad se alcanza a los 18 años (art. 12 de la Constitución) y las condiciones de uso de Apaño exigen ser mayor de edad, sin excepciones ni permisos de padres o tutores. Por eso no se puede cambiar desde aquí.</p>
          </div>
        </section>
        <section class="pg-adm-aj-b" aria-labelledby="pg-adm-aj-t2">
          <div class="col g6"><h3 class="pg-adm-aj-t" id="pg-adm-aj-t2">Documentos admitidos</h3><p class="sm sec">Con qué se puede verificar la identidad. Tiene que quedar al menos uno activo.</p></div>
          <div class="pg-adm-sw">${DOCS.map(([k, t, d]) => `<div class="pg-adm-sw-f"><span class="col min0"><span class="negrita" id="pg-adm-sw-${k}">${t}</span><span class="xs ter">${d}</span></span><button type="button" class="interruptor" role="switch" aria-checked="${T.docs[k]}" aria-labelledby="pg-adm-sw-${k}" data-doc="${k}"></button></div>`).join('')}</div>
        </section>
        <section class="pg-adm-aj-b" aria-labelledby="pg-adm-aj-t3">
          <div class="col g6"><h3 class="pg-adm-aj-t" id="pg-adm-aj-t3"><label for="pg-adm-aj-u">Umbral de coincidencia facial</label></h3><p class="sm sec">Por debajo, la selfie sale en ámbar (o en rojo si baja del 60 %) y aprobar pide confirmación.</p></div>
          <div class="col g10">
            <output class="cifra pg-adm-aj-v" for="pg-adm-aj-u" id="pg-adm-aj-uv">${T.umbral} %</output>
            <input type="range" class="pg-adm-rango" id="pg-adm-aj-u" min="60" max="99" step="1" value="${T.umbral}" aria-describedby="pg-adm-aj-uc">
            <div class="fila entre xs ter"><span>60 % · más permisivo</span><span>99 % · más estricto</span></div>
            <p class="ayuda" id="pg-adm-aj-uc"></p>
          </div>
        </section>
        <section class="pg-adm-aj-b" aria-labelledby="pg-adm-aj-t4">
          <div class="col g6"><h3 class="pg-adm-aj-t" id="pg-adm-aj-t4"><label for="pg-adm-aj-b">Bloqueo tras un intento de menor</label></h3><p class="sm sec">Cuánto tiempo bloqueamos el dispositivo desde el que un menor intenta darse de alta.</p></div>
          <select class="ent" id="pg-adm-aj-b">${Object.keys(BLOQUEO).map(k => `<option value="${k}"${T.bloqueo === k ? ' selected' : ''}>${BLOQUEO[k]}</option>`).join('')}</select>
        </section>
        <section class="pg-adm-aj-b" aria-labelledby="pg-adm-aj-t5">
          <div class="col g6"><h3 class="pg-adm-aj-t" id="pg-adm-aj-t5"><label for="pg-adm-aj-r">Retención de imágenes del documento</label></h3><p class="sm sec">Cuándo borramos las fotos del documento y la selfie. Guardamos solo el resultado de la verificación; el número nunca se publica y solo lo ve el equipo de verificación.</p></div>
          <select class="ent" id="pg-adm-aj-r">${Object.keys(RETEN).map(k => `<option value="${k}"${T.retencion === k ? ' selected' : ''}>${k === '0' ? 'Al resolver la solicitud' : 'A los ' + k + ' días'}</option>`).join('')}</select>
        </section>
        <div class="pg-adm-aj-pie" id="pg-adm-aj-pie"><span class="sm sec" id="pg-adm-aj-est" aria-live="polite">Sin cambios</span><button type="button" class="btn btn-sec btn-p" id="pg-adm-aj-des" disabled>Descartar</button><button type="submit" class="btn btn-p" id="pg-adm-aj-g" disabled>Guardar</button></div>
      </div>
      <aside class="pg-adm-lat-b bloque-marca pegajoso" aria-labelledby="pg-adm-pol-t">
        <span class="etiqueta" id="pg-adm-pol-t" style="color:var(--marca-tinta)">Política activa</span>
        <ul class="pg-adm-pol" id="pg-adm-pol"></ul>
      </aside>
    </form>`;
  const politica = t => [
    ['candado', `Solo <b>mayores de 18</b>. Sin excepciones.`],
    ['carnet', `Documentos: <b>${DOCS.filter(d => t.docs[d[0]]).map(d => d[1]).join(', ').replace(/, ([^,]*)$/, ' y $1')}</b>.`],
    ['ojo', `Selfie con coincidencia del <b>${t.umbral} %</b> o más.`],
    ['prohibido', `Intento de un menor: dispositivo bloqueado <b>${BLOQUEO[t.bloqueo]}</b>.`],
    ['papelera', `Imágenes del documento: se borran <b>${RETEN[t.retencion]}</b>.`]
  ];
  const cambiosAj = () => {
    const c = [];
    DOCS.forEach(([k, t]) => { if(T.docs[k] !== E.aj.docs[k]) c.push(`${T.docs[k] ? 'Activó' : 'Desactivó'} el ${t} como documento admitido`) });
    if(T.umbral !== E.aj.umbral) c.push(`Cambió el umbral de coincidencia facial del ${E.aj.umbral} % al ${T.umbral} %`);
    if(T.bloqueo !== E.aj.bloqueo) c.push(`Cambió el bloqueo tras un intento de menor de ${BLOQUEO[E.aj.bloqueo]} a ${BLOQUEO[T.bloqueo]}`);
    if(T.retencion !== E.aj.retencion) c.push(`Cambió la retención de imágenes de documentos: ahora se borran ${RETEN[T.retencion]}`);
    return c;
  };
  const pintaAjustes = cambiado => {
    const r = $('#pg-adm-aj-u'); if(!r) return;
    r.value = T.umbral; r.style.setProperty('--v', ((T.umbral - 60) / 39 * 100) + '%');
    $('#pg-adm-aj-uv').textContent = T.umbral + ' %';
    const con = V.filter(v => estV(v) === 'pendiente' && coinc(v) !== null), bajo = con.filter(v => coinc(v) < T.umbral).length;
    $('#pg-adm-aj-uc').textContent = con.length ? `Con este umbral, ${bajo} de ${con.length} selfies en cola ${bajo === 1 ? 'queda' : 'quedan'} por debajo` : 'No hay selfies en cola ahora mismo';
    $$('#pg-adm-aj .interruptor').forEach(s => s.setAttribute('aria-checked', !!T.docs[s.dataset.doc]));
    $('#pg-adm-aj-b').value = T.bloqueo; $('#pg-adm-aj-r').value = T.retencion;
    $('#pg-adm-pol').innerHTML = politica(T).map(([i, t], n) => `<li${cambiado === n ? ' class="cambia"' : ''}>${ic(i, 16)}<span>${t}</span></li>`).join('');
    const c = cambiosAj().length;
    $('#pg-adm-aj-est').textContent = c ? (c === 1 ? '1 cambio sin guardar' : `${c} cambios sin guardar`) : 'Sin cambios';
    $('#pg-adm-aj-pie').classList.toggle('sucio', !!c);
    $('#pg-adm-aj-g').disabled = !c; $('#pg-adm-aj-des').disabled = !c;
  };
  const enlazaAjustes = () => {
    const f = $('#pg-adm-aj'); if(!f) return;
    f.addEventListener('click', e => {
      const s = e.target.closest('.interruptor[data-doc]'); if(!s) return;
      const k = s.dataset.doc;
      if(T.docs[k] && Object.values(T.docs).filter(Boolean).length === 1){ A.avisa('Tiene que quedar al menos un documento admitido', 'mal'); return }
      T.docs[k] = !T.docs[k]; pintaAjustes(1);
    });
    $('#pg-adm-aj-u').addEventListener('input', e => { T.umbral = +e.target.value; pintaAjustes(2) });
    $('#pg-adm-aj-b').addEventListener('change', e => { T.bloqueo = e.target.value; pintaAjustes(3) });
    $('#pg-adm-aj-r').addEventListener('change', e => { T.retencion = e.target.value; pintaAjustes(4) });
    $('#pg-adm-aj-des').addEventListener('click', () => { T = JSON.parse(JSON.stringify(E.aj)); pintaAjustes(); A.avisa('Cambios descartados') });
    f.addEventListener('submit', e => {
      e.preventDefault();
      const c = cambiosAj(); if(!c.length) return;
      E.aj = JSON.parse(JSON.stringify(T)); E.aj.edad = 18; guarda();
      c.forEach(x => registra(x, 'ajustes'));
      pintaAjustes(); pintaCola();
      A.avisa(c.length === 1 ? 'Ajuste guardado' : `${c.length} ajustes guardados`);
    });
    pintaAjustes();
  };

  /* ======================================================================
     MONTAJE
     ====================================================================== */
  const pintaCifras = () => {
    cifras().forEach((c, i) => {
      const el = $(`[data-cifra="${i}"]`); if(!el) return;
      const n = el.querySelector('.pg-adm-cifra-n');
      if(n.textContent !== String(c.n)){ n.textContent = c.n; n.dataset.cuenta = c.n; n.classList.remove('bote'); void n.offsetWidth; n.classList.add('bote') }
      el.querySelector('.pg-adm-cifra-sub').textContent = c.sub;
    });
    const fija = (id, n, mal) => { const b = $(`.pg-adm-n[data-n="${id}"]`); if(!b) return; b.textContent = n; b.hidden = !n; b.classList.toggle('mal', !!mal) };
    fija('identidades', V.filter(v => estV(v) === 'pendiente').length, V.some(v => estV(v) === 'pendiente' && menorV(v)));
    fija('anuncios', A.ANUNCIOS.filter(porRevisar).length);
    fija('reportes', A.REPORTES.filter(r => estR(r) === 'abierto').length, A.REPORTES.some(r => estR(r) === 'abierto' && menorR(r)));
    dispatchEvent(new Event('resize'));
  };
  const irA = (tab, ancla) => {
    const b = $(`.pestana[aria-controls="${tab}"]`);
    if(b && b.getAttribute('aria-selected') !== 'true') b.click();
    requestAnimationFrame(() => {
      const cab = ($('.cab') || {}).offsetHeight || 0, pest = $('.pg-adm-pest');
      const el = ancla ? $('#' + ancla) : pest; if(!el) return;
      const extra = ancla ? pest.offsetHeight + 14 : 0;
      scrollTo({top: Math.max(0, el.getBoundingClientRect().top + scrollY - cab - extra), behavior: quieto ? 'auto' : 'smooth'});
    });
  };

  raiz.innerHTML = `
    <section class="pg-adm-hero" aria-labelledby="pg-adm-h1"><div class="contenedor">
      <div class="pg-adm-hero-fila">
        <div class="col g6 min0"><span class="etiqueta">Confianza y seguridad · ${fechaLarga}</span><h1 class="h1" id="pg-adm-h1">Moderación</h1><p class="sec">Hola, ${esc(pila(yo.n))}. Aquí se decide quién entra: nadie menor de 18 pasa a Apaño, y lo que se publica tiene que ser de fiar.</p></div>
        <button class="pg-adm-yo" type="button" id="pg-adm-yo" aria-haspopup="dialog">${A.avatar(yo)}<span><b>${esc(yo.n)}</b><small>${esAdmin ? 'Administración' : 'Moderación'} · cambiar perfil</small></span>${ic('abajo',16)}</button>
      </div>
      <div class="pg-adm-cifras" role="group" aria-label="Resumen de hoy">${cifras().map(tile).join('')}</div>
    </div></section>
    <div class="pg-adm-pest"><div class="contenedor"><div class="pestanas" data-pestanas role="tablist" aria-label="Secciones de moderación">${TABS.map((t, i) => `<button class="pestana" type="button" role="tab" id="pg-adm-t-${t.id}" aria-controls="${t.id}" aria-selected="${i === 0}">${t.t}${t.n ? `<span class="pg-adm-n" data-n="${t.id}" hidden>0</span>` : ''}</button>`).join('')}</div></div></div>
    <div class="contenedor pg-adm-paneles">
      <section class="pg-adm-panel" id="identidades" role="tabpanel" aria-labelledby="pg-adm-t-identidades">${panelIdentidades()}</section>
      <section class="pg-adm-panel" id="usuarios" role="tabpanel" aria-labelledby="pg-adm-t-usuarios" hidden>${panelUsuarios()}</section>
      <section class="pg-adm-panel" id="anuncios" role="tabpanel" aria-labelledby="pg-adm-t-anuncios" hidden>${panelAnuncios()}</section>
      <section class="pg-adm-panel" id="reportes" role="tabpanel" aria-labelledby="pg-adm-t-reportes" hidden>${panelReportes()}</section>
      <section class="pg-adm-panel" id="registro" role="tabpanel" aria-labelledby="pg-adm-t-registro" hidden>${panelRegistro()}</section>
      ${esAdmin ? `<section class="pg-adm-panel" id="equipo" role="tabpanel" aria-labelledby="pg-adm-t-equipo" hidden>${panelEquipo()}</section>
      <section class="pg-adm-panel" id="ajustes" role="tabpanel" aria-labelledby="pg-adm-t-ajustes" hidden>${panelAjustes()}</section>` : ''}
    </div>`;

  pintaCola(); pintaUsuarios(); pintaAnuncios(); pintaReportes(); pintaRegistro();
  if(esAdmin){ pintaEquipo(); enlazaAjustes() }
  pintaCifras();

  /* altura real de la cabecera (en móvil lleva el buscador debajo) para fijar las pestañas justo debajo */
  const ajustaCab = () => { const c = $('.cab'); if(c) raiz.style.setProperty('--pg-adm-cab', c.offsetHeight + 'px') };
  ajustaCab(); addEventListener('resize', ajustaCab);

  /* en móvil la tira de pestañas se desliza para que la activa quede a la vista */
  const tira = $('.pg-adm-pest .pestanas');
  const centra = b => { if(b) tira.scrollTo({left: Math.max(0, b.offsetLeft - (tira.clientWidth - b.offsetWidth) / 2), behavior: quieto ? 'auto' : 'smooth'}) };
  tira.addEventListener('click', e => centra(e.target.closest('.pestana')));
  requestAnimationFrame(() => centra(tira.querySelector('.pestana[aria-selected="true"]')));

  /* ---------- eventos ---------- */
  $('#pg-adm-yo').addEventListener('click', A.abreCuenta);
  const fu = $('#pg-adm-u-f');
  fu.addEventListener('submit', e => e.preventDefault());
  fu.addEventListener('input', () => { fU.q = $('#pg-adm-u-q').value; fU.e = $('#pg-adm-u-e').value; fU.t = $('#pg-adm-u-t').value; fU.r = $('#pg-adm-u-r').value; pintaUsuarios() });
  $('#pg-adm-a-est').addEventListener('click', e => { const c = e.target.closest('[data-est]'); if(!c) return; fA.est = c.dataset.est; pintaAnuncios() });
  $('#pg-adm-a-cat').addEventListener('change', e => { fA.cat = e.target.value; pintaAnuncios() });
  $('#pg-adm-r-f').addEventListener('click', e => { const c = e.target.closest('[data-rf]'); if(!c) return; fR.f = c.dataset.rf; pintaReportes() });
  $('#pg-adm-log-f').addEventListener('click', e => { const c = e.target.closest('[data-lf]'); if(!c) return; fL.f = c.dataset.lf; pintaRegistro() });
  const inv = $('#pg-adm-inv');
  if(inv) inv.addEventListener('submit', e => {
    e.preventDefault();
    const em = $('#pg-adm-inv-e'), r = $('#pg-adm-inv-r').value, v = em.value.trim();
    if(!A.emailValido(v)){ em.setAttribute('aria-invalid', 'true'); $('#pg-adm-inv-err').hidden = false; em.focus(); return }
    em.removeAttribute('aria-invalid'); $('#pg-adm-inv-err').hidden = true;
    E.inv.unshift({e:v, r}); guarda(); em.value = '';
    registra(`Preparó una invitación a ${v} para ${ROL[r].toLowerCase()}`, 'equipo');
    A.avisa('Invitación preparada (en la demo no se envía)');
  });

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-pg]'); if(!b) return;
    const id = b.dataset.id, acc = b.dataset.pg;
    const v = V.find(x => x.id === id), u = A.usuario(id), a = A.anuncio(id), r = A.REPORTES.find(x => x.id === id);
    if(acc !== 'mostrar' && b.closest('.capa') && !b.closest('form')) A.cerrarDialogo();
    switch(acc){
      case 'ir': if(b.dataset.filtro){ fL.f = b.dataset.filtro; pintaRegistro() } irA(b.dataset.tab, b.dataset.ancla); break;
      case 'ir-autos': e.preventDefault(); irA('identidades', 'pg-adm-autos'); break;
      case 'mostrar': alternaDoc(b); break;
      case 'ver-docs': if(v) verDocs(v); break;
      case 'aprobar': if(v) aprobar(v); break;
      case 'rechazar': if(v) rechazar(v); break;
      case 'foto': if(v) otraFoto(v); break;
      case 'revisar-auto': if(v) fichaAuto(v); break;
      case 'devolver': if(v) devolver(v); break;
      case 'u-ficha': if(u) fichaU(u); break;
      case 'u-suspender': if(u) suspender(u); break;
      case 'u-reactivar': if(u) reactivar(u); break;
      case 'u-reverificar': if(u) reverificar(u); break;
      case 'u-limpia': fU.q = fU.e = fU.t = fU.r = ''; fu.reset(); pintaUsuarios(); break;
      case 'a-revisado':
        if(!a) break;
        E.anu[a.id] = Object.assign({}, E.anu[a.id], {rev:true}); guarda();
        registra(`Revisó el anuncio «${a.t}» de ${A.usuario(a.u).corto}: todo en orden`, 'anuncios'); repintaA(a); A.avisa('Anuncio revisado'); break;
      case 'a-ocultar':
        if(!a) break;
        E.anu[a.id] = Object.assign({}, E.anu[a.id], {estado:'oculto', rev:true}); guarda();
        registra(`Ocultó el anuncio «${a.t}» de ${A.usuario(a.u).corto}`, 'anuncios'); repintaA(a); A.avisa('Anuncio oculto. Puedes volver a mostrarlo'); break;
      case 'a-mostrar':
        if(!a) break;
        E.anu[a.id] = Object.assign({}, E.anu[a.id], {estado:a.estado, porSusp:false, nota:''}); guarda();
        registra(`Volvió a mostrar el anuncio «${a.t}» de ${A.usuario(a.u).corto}`, 'anuncios'); repintaA(a); A.avisa('Anuncio visible otra vez'); break;
      case 'a-restaurar':
        if(!a) break;
        E.anu[a.id] = Object.assign({}, E.anu[a.id], {estado:a.estado, nota:''}); guarda();
        registra(`Restauró el anuncio «${a.t}» de ${A.usuario(a.u).corto}`, 'anuncios'); repintaA(a); A.avisa('Anuncio restaurado'); break;
      case 'a-cambios': if(a) pedirCambios(a); break;
      case 'a-eliminar': if(a) eliminar(a); break;
      case 'r-ver': if(r) verReporte(r); break;
      case 'reset':
        A.dialogo(`<div class="dialogo-cuerpo col g16 pg-adm-hoja"><div class="col g6 pg-adm-hoja-cab"><span class="etiqueta">Demostración</span><h2 class="h2">¿Empezar de cero?</h2><p class="sm sec">Se deshace todo lo que has hecho en esta sesión: la cola, las cuentas, los anuncios, los reportes y los ajustes vuelven a como estaban. El registro original no se toca.</p></div>
          <div class="pg-adm-hoja-acc"><button type="button" class="btn btn-sec" data-cerrar>Cancelar</button><button type="button" class="btn btn-peligro" id="pg-adm-reset-si">${ic('deshacer',17)} Empezar de cero</button></div></div>`,
          {ancho:480, alAbrir:capa => $('#pg-adm-reset-si', capa).addEventListener('click', () => { try{ sessionStorage.removeItem(CLAVE) }catch(err){} location.reload() })});
        break;
    }
  });
};
</script>
